name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every new commit message
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then shas=$(git rev-list -1 "$HEAD"); else shas=$(git rev-list "$BASE..$HEAD"); fi
          status=0
          for sha in $shas; do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            .githooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          done
          exit $status

  npm:
    name: npm packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test 'npm/test/*.test.js'

  dashboard:
    name: Dashboard web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: The build committed in cli/assets/dashboard matches the sources
        run: |
          git diff --exit-code -- ../cli/assets/dashboard
          untracked=$(git status --porcelain -- ../cli/assets/dashboard)
          if [ -n "$untracked" ]; then echo "$untracked"; echo "run 'npm run build' in dashboard/ and commit cli/assets/dashboard"; exit 1; fi

  dashboard-browser:
    name: Dashboard in a browser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global agent-browser@0.39.0
      - if: runner.os == 'Linux'
        run: agent-browser install --with-deps
      - if: runner.os != 'Linux'
        run: agent-browser install
      - run: cargo clippy --all-targets --features browser-tests -- -D warnings
      - run: "cargo test --features browser-tests --test cli browser::"

  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Install fish for the shell tests
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install --yes fish
          fish --version
      - name: Install fish for the shell tests
        if: runner.os == 'macOS'
        run: |
          brew install fish
          fish --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Rerun the CLI tests to surface timing flakes
        run: for run in 1 2 3 4; do cargo test --quiet --test cli || exit 1; done
