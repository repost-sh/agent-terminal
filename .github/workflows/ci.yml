name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every new commit message
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then shas=$(git rev-list -1 "$HEAD"); else shas=$(git rev-list "$BASE..$HEAD"); fi
          status=0
          for sha in $shas; do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            .githooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          done
          exit $status

  npm:
    name: npm packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test 'npm/test/*.test.js'

  dashboard:
    name: Dashboard web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: The build committed in cli/assets/dashboard matches the sources
        run: |
          git diff --exit-code -- ../cli/assets/dashboard
          untracked=$(git status --porcelain -- ../cli/assets/dashboard)
          if [ -n "$untracked" ]; then echo "$untracked"; echo "run 'npm run build' in dashboard/ and commit cli/assets/dashboard"; exit 1; fi

  dashboard-browser:
    name: Dashboard in a browser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global agent-browser@0.39.0
      - if: runner.os == 'Linux'
        run: agent-browser install --with-deps
      - if: runner.os != 'Linux'
        run: agent-browser install
      - run: cargo clippy --all-targets --features browser-tests -- -D warnings
      - run: "cargo test --features browser-tests --test cli browser::"

  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Install zsh and fish for the shell tests
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install --yes zsh fish
          zsh --version
          fish --version
      - name: Install fish for the shell tests
        if: runner.os == 'macOS'
        run: |
          brew install fish
          zsh --version
          fish --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Rerun the CLI tests to surface timing flakes
        run: for run in 1 2 3 4; do echo "rerun $run of 4"; cargo test --quiet --test cli || exit 1; done

  performance:
    name: Speed and memory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build agent-terminal at the base of this change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          cargo build --release --manifest-path "$RUNNER_TEMP/base/cli/Cargo.toml" --target-dir target --bin agent-terminal
          cp target/release/agent-terminal "$RUNNER_TEMP/agent-terminal-base"
      - name: Build this change's agent-terminal, the fixtures and at-perf
        run: cargo build --release --workspace --bins
      - name: Measure the base and this change, interleaved on this runner
        run: >-
          target/release/at-perf measure
          --base "$RUNNER_TEMP/agent-terminal-base"
          --change target/release/agent-terminal
          --fixtures target/release
          --work "$RUNNER_TEMP/performance"
          --out "$RUNNER_TEMP/performance-${{ matrix.os }}.json"
      - name: Keep this run's samples
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ matrix.os }}
          path: ${{ runner.temp }}/performance-${{ matrix.os }}.json
          if-no-files-found: error
      - name: Fail on a metric over its limit or a regression against the base
        run: target/release/at-perf check "$RUNNER_TEMP/performance-${{ matrix.os }}.json" --summary "$GITHUB_STEP_SUMMARY"
