name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mutation_base:
        description: The commit the mutation area diffs HEAD against
        default: HEAD~1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every new commit message
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then shas=$(git rev-list -1 "$HEAD"); else shas=$(git rev-list "$BASE..$HEAD"); fi
          status=0
          for sha in $shas; do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            .githooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          done
          exit $status

  gauntlet:
    name: Gauntlet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gauntlet-tools
        with:
          cargo-tools: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-mutants@27.1.0
          shells: true
          dashboard: true
      - run: scripts/gauntlet.sh
      - name: Rerun the CLI tests to surface timing flakes
        working-directory: cli
        run: for run in 1 2 3 4; do echo "rerun $run of 4"; cargo test --quiet --test cli || exit 1; done

  browser:
    name: Gauntlet browser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gauntlet-tools
        with:
          browser: true
      - run: scripts/gauntlet.sh browser

  coverage:
    name: Gauntlet coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gauntlet-tools
        with:
          cargo-tools: cargo-llvm-cov@0.8.7
          shells: true
          browser: true
      - run: rustup component add llvm-tools-preview
      - run: scripts/gauntlet.sh coverage

  acceptance-faults:
    name: Gauntlet acceptance faults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gauntlet-tools
        with:
          cargo-tools: cargo-mutants@27.1.0
      - run: scripts/gauntlet.sh acceptance-faults

  mutation:
    name: Gauntlet mutation
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gauntlet-tools
        with:
          cargo-tools: cargo-mutants@27.1.0
          shells: true
          dashboard: true
      - env:
          GAUNTLET_MUTATION_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.mutation_base }}
          GAUNTLET_MUTATION_SHARDS: 2
        run: scripts/gauntlet.sh mutation

  performance:
    name: Speed and memory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build agent-terminal at the base of this change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          cargo build --release --manifest-path "$RUNNER_TEMP/base/cli/Cargo.toml" --target-dir target --bin agent-terminal
          cp target/release/agent-terminal "$RUNNER_TEMP/agent-terminal-base"
      - name: Build this change's agent-terminal, the fixtures and at-perf
        run: cargo build --release --workspace --bins
      - name: Measure the base and this change, interleaved on this runner
        run: >-
          target/release/at-perf measure
          --base "$RUNNER_TEMP/agent-terminal-base"
          --change target/release/agent-terminal
          --fixtures target/release
          --work "$RUNNER_TEMP/performance"
          --out "$RUNNER_TEMP/performance-${{ matrix.os }}.json"
      - name: Keep this run's samples
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ matrix.os }}
          path: ${{ runner.temp }}/performance-${{ matrix.os }}.json
          if-no-files-found: error
      - name: Fail on a metric over its limit or a regression against the base
        run: target/release/at-perf check "$RUNNER_TEMP/performance-${{ matrix.os }}.json" --summary "$GITHUB_STEP_SUMMARY"
