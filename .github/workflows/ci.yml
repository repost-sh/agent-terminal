name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: The commit the change is mutated and measured against
        default: HEAD~1

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every new commit message
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if base=$(scripts/push-base.sh "$BASE"); then shas=$(git rev-list "$base..$HEAD"); else shas=$(git rev-list -1 "$HEAD"); fi
          status=0
          for sha in $shas; do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            .githooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          done
          exit $status

  gauntlet:
    name: Gauntlet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 50 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gauntlet-tools
        with:
          cargo-tools: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-mutants@27.1.0
          shells: true
          dashboard: true
      - name: Install actionlint 1.7.12
        if: runner.os == 'Linux'
        env:
          ARCHIVE: actionlint_1.7.12_linux_amd64.tar.gz
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$ARCHIVE" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: scripts/gauntlet.sh
      - if: runner.os == 'Linux'
        run: scripts/gauntlet.sh workflows
      - name: Rerun the CLI tests to surface timing flakes
        working-directory: cli
        run: for run in 1 2 3 4; do echo "rerun $run of 4"; cargo test --quiet --test cli || exit 1; done

  browser:
    name: Gauntlet browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gauntlet-tools
        with:
          browser: true
      - run: scripts/gauntlet.sh browser

  coverage:
    name: Gauntlet coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gauntlet-tools
        with:
          cargo-tools: cargo-llvm-cov@0.8.7
          shells: true
          browser: true
      - run: rustup component add llvm-tools-preview
      - run: scripts/gauntlet.sh coverage

  acceptance-faults:
    name: Gauntlet acceptance faults
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gauntlet-tools
        with:
          cargo-tools: cargo-mutants@27.1.0
      - run: scripts/gauntlet.sh acceptance-faults

  mutation:
    name: Gauntlet mutation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gauntlet-tools
        with:
          cargo-tools: cargo-mutants@27.1.0
          shells: true
          dashboard: true
      - name: Take the commit the push started from, or the one before HEAD after a force-push
        id: pushed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: echo "base=$(scripts/push-base.sh "$BEFORE" || echo HEAD~1)" >> "$GITHUB_OUTPUT"
      - env:
          GAUNTLET_MUTATION_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || steps.pushed.outputs.base || inputs.base }}
          GAUNTLET_MUTATION_SHARDS: 2
        run: scripts/gauntlet.sh mutation

  performance:
    name: Speed and memory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          cache-on-failure: true
      - name: Build agent-terminal at the base and at this change with the same command
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          build() {
            features=()
            if grep -q '^private-daemon = ' "$1/Cargo.toml"; then
              features=(--features private-daemon)
            fi
            cargo clean --release --manifest-path "$1/Cargo.toml" --target-dir target -p agent-terminal
            cargo build --release --manifest-path "$1/Cargo.toml" --target-dir target -p agent-terminal "${features[@]}"
            cp target/release/agent-terminal "$2"
          }
          build "$RUNNER_TEMP/base/cli" "$RUNNER_TEMP/agent-terminal-base"
          build . "$RUNNER_TEMP/agent-terminal-change"
      - name: Build the fixtures and at-perf
        run: cargo build --release -p at-fixtures -p at-perf --bins
      - name: Measure the base and this change, interleaved on this runner
        run: >-
          target/release/at-perf measure
          --base "$RUNNER_TEMP/agent-terminal-base"
          --change "$RUNNER_TEMP/agent-terminal-change"
          --fixtures target/release
          --work "$RUNNER_TEMP/performance"
          --out "$RUNNER_TEMP/performance.json"
      - name: Keep this run's samples
        uses: actions/upload-artifact@v7
        with:
          name: performance
          path: ${{ runner.temp }}/performance.json
          if-no-files-found: error
      - name: Fail on a metric over its limit or a regression against the base
        run: target/release/at-perf check "$RUNNER_TEMP/performance.json" --summary "$GITHUB_STEP_SUMMARY"
