name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every new commit message
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then shas=$(git rev-list -1 "$HEAD"); else shas=$(git rev-list "$BASE..$HEAD"); fi
          status=0
          for sha in $shas; do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            .githooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          done
          exit $status

  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Rerun the CLI tests to surface timing flakes
        run: for run in 1 2 3 4; do cargo test --quiet --test cli || exit 1; done
