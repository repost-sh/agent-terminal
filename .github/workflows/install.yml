name: Clean install

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  test:
    needs: build
    uses: ./.github/workflows/install-test.yml
    with:
      version: ${{ fromJson(needs.build.outputs.plan).releases[0].app_version }}
