name: Release preflight

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  preflight:
    name: Tag, changelog and npm dry run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Check the tag against cli/Cargo.toml, its CHANGELOG.md section and npm publish --dry-run of every package
        env:
          TAG: ${{ github.ref_name }}
        run: node npm/preflight.js --tag "$TAG"
