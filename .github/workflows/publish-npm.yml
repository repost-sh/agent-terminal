name: Publish npm packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Fetch the npm packages
        uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: npm-tarballs
      - name: Publish the platform packages, then the main package
        run: |
          publish() {
            spec=$(tar -xzOf "$1" package/package.json | jq -r '.name + "@" + .version')
            if npm view "$spec" version > /dev/null 2>&1; then
              echo "$spec is already on npm"
            else
              npm publish "$1" --access public --provenance
            fi
          }
          main=
          for tarball in npm-tarballs/*.tgz; do
            if tar -xzOf "$tarball" package/package.json | jq -e '.optionalDependencies' > /dev/null; then
              main=$tarball
            else
              publish "$tarball"
            fi
          done
          test -n "$main"
          publish "$main"
