name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}

  notes:
    name: Take the release notes from CHANGELOG.md
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.notes.outputs.version }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - id: notes
        env:
          PLAN: ${{ needs.build.outputs.plan }}
        run: |
          printf '%s' "$PLAN" > plan.json
          if [ -z "$(jq -r '.announcement_changelog // empty' plan.json)" ]; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME: add one and tag again" >&2
            exit 1
          fi
          mkdir notes
          jq -r .announcement_title plan.json > notes/title
          jq -r .announcement_github_body plan.json > notes/body.md
          echo "version=$(jq -r '.releases[0].app_version' plan.json)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r .announcement_is_prerelease plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes/
          if-no-files-found: error

  test:
    needs: notes
    uses: ./.github/workflows/install-test.yml
    with:
      version: ${{ needs.notes.outputs.version }}

  npm-check:
    name: Check that npm accepts every package
    needs: notes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: npm-tarballs
      - name: npm publish --dry-run each package
        if: needs.notes.outputs.prerelease == 'false'
        run: |
          for tarball in npm-tarballs/*.tgz; do
            npm publish --dry-run --access public "$tarball"
          done

  github-release:
    name: Create the GitHub release
    needs: [notes, test, npm-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: files
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: global
          path: files
      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: notes
      - run: rm files/*-dist-manifest.json
      - uses: actions/attest@v4
        with:
          subject-path: files/*
      - name: Create the release with the CHANGELOG.md section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.notes.outputs.prerelease }}
        run: |
          options=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$(cat notes/title)" --notes-file notes/body.md)
          if [ "$PRERELEASE" = true ]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${options[@]}" files/*

  homebrew:
    name: Push the formula to repost-sh/homebrew-tap
    needs: [notes, github-release]
    if: needs.notes.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: repost-sh/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: global
          path: ${{ runner.temp }}/global
      - name: Commit and push the formula
        env:
          VERSION: ${{ needs.notes.outputs.version }}
        run: |
          mkdir -p Formula
          cp "$RUNNER_TEMP/global/agent-terminal.rb" Formula/agent-terminal.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-terminal.rb
          git commit -m "agent-terminal $VERSION"
          git push

  npm:
    name: Publish to npm
    needs: [notes, github-release]
    if: needs.notes.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.notes.outputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: npm-tarballs
      - name: Publish the platform packages, then the main package that depends on them
        run: |
          main=npm-tarballs/repost-agent-terminal-$VERSION.tgz
          for tarball in npm-tarballs/*.tgz; do
            if [ "$tarball" != "$main" ]; then
              npm publish --access public "$tarball"
            fi
          done
          npm publish --access public "$main"

  verify:
    name: Install the published ${{ matrix.channel }} package on ${{ matrix.runner }}
    needs: [notes, homebrew, npm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            channel: npm
            fixture: x86_64-unknown-linux-musl
          - runner: macos-14
            channel: npm
            fixture: aarch64-apple-darwin
          - runner: macos-14
            channel: homebrew
            fixture: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.notes.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: fixture-${{ matrix.fixture }}
          path: ${{ runner.temp }}/fixture
      - run: chmod +x "$RUNNER_TEMP/fixture/line-printer"
      - name: Install @repost/agent-terminal@${{ needs.notes.outputs.version }} from npm
        if: matrix.channel == 'npm'
        run: |
          npm install --global --prefix "$RUNNER_TEMP/state/npm" "@repost/agent-terminal@$VERSION"
          echo "$RUNNER_TEMP/state/npm/bin" > "$RUNNER_TEMP/state/bin-dir"
      - name: Install repost-sh/tap/agent-terminal with Homebrew
        if: matrix.channel == 'homebrew'
        run: |
          brew install repost-sh/tap/agent-terminal
          mkdir -p "$RUNNER_TEMP/state"
          echo "$(brew --prefix)/bin" > "$RUNNER_TEMP/state/bin-dir"
      - run: sh .github/install-test/check.sh "$RUNNER_TEMP/state" "$VERSION" "$RUNNER_TEMP/fixture/line-printer"
