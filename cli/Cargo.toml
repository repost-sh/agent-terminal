[package]
name = "agent-terminal"
version = "0.1.0"
edition = "2024"
description = "Fast terminal automation CLI for AI agents"
license = "Apache-2.0"
repository = "https://github.com/repost-sh/agent-terminal"
homepage = "https://github.com/repost-sh/agent-terminal"
readme = "../README.md"
keywords = ["terminal", "tui", "automation", "ai", "pty"]
categories = ["command-line-utilities", "development-tools::testing"]

[workspace]
members = ["tests/fixtures"]

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env", "string"] }
humantime = "2"
libc = "0.2"
nix = { version = "0.28", features = ["fs", "signal"] }
png = "0.18"
portable-pty = "0.9"
regex = "1"
rmcp = { version = "2.2", default-features = false, features = ["server", "transport-io"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"
swash = "0.2"
tiny-skia = "0.12"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tokio = { version = "1", features = ["process", "rt"] }

[dev-dependencies]
insta = "1.49"
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt"] }

[profile.release]
lto = "thin"
strip = true

[profile.dist]
inherits = "release"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[lints]
workspace = true
