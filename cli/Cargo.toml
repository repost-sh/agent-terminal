[package]
name = "agent-terminal"
version = "0.1.0"
edition = "2024"
description = "Fast terminal automation CLI for AI agents"
license = "Apache-2.0"
repository = "https://github.com/repost-sh/agent-terminal"
homepage = "https://github.com/repost-sh/agent-terminal"
readme = "../README.md"
keywords = ["terminal", "tui", "automation", "ai", "pty"]
categories = ["command-line-utilities", "development-tools::testing"]

[workspace]
members = ["perf", "tests/fixtures"]

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
clap = { version = "4.6", features = ["derive", "env", "string"] }
gif = { version = "0.14", default-features = false, features = ["std"] }
humantime = "2"
include_dir = "0.7"
libc = "0.2"
nix = { version = "0.28", features = ["fs", "signal"] }
openh264 = "0.9"
png = "0.18"
portable-pty = "0.9"
regex = "1"
rmcp = { version = "2.2", default-features = false, features = ["server", "transport-io"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"
swash = "0.2"
tiny-skia = "0.12"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tokio = { version = "1", features = ["macros", "net", "process", "rt", "sync"] }

[features]
browser-tests = []

[dev-dependencies]
insta = "1.49"
mp4 = "0.14"
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt"] }

[profile.release]
lto = "thin"
strip = true

[profile.dist]
inherits = "release"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[lints]
workspace = true
