[package]
name = "at-acceptance"
version = "0.0.0"
edition = "2024"
publish = false
description = "Black-box acceptance scenarios for agent-terminal, run against the built binary"

[dependencies]
gherkin-cargo-test = "0.7"
libtest-mimic = "0.8"
serde_json = "1"
tempfile = "3"

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints]
workspace = true
