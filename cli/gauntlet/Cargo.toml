[package]
name = "at-gauntlet"
version = "0.0.0"
edition = "2024"
publish = false
description = "Checks agent-terminal's coverage report against the gauntlet's coverage floor and CRAP ceiling"

[dependencies]
anyhow = "1"
gherkin-cargo-test = "0.7"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
serde_json = "1"
proptest = { version = "1.12", default-features = false, features = ["std"] }
tempfile = "3"

[lints]
workspace = true
