[package]
name = "at-gauntlet"
version = "0.0.0"
edition = "2024"
publish = false
description = "Checks agent-terminal's coverage report against the gauntlet's coverage floor and CRAP ceiling"

[dependencies]
anyhow = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
