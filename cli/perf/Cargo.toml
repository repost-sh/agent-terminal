[package]
name = "at-perf"
version = "0.0.0"
edition = "2024"
publish = false
description = "Measures agent-terminal's speed and memory targets from outside the binary and checks them"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
