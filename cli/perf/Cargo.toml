[package]
name = "at-perf"
version = "0.0.0"
edition = "2024"
publish = false
description = "Measures agent-terminal's speed and memory targets from outside the binary and checks them"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
tempfile = "3"

[lints]
workspace = true
