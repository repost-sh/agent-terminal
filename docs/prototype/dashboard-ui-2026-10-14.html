        const exited = tab.status === "exited";
        const dim = exited || tab.stream === "reconnecting";
        const label = `${tabName(tab)} ${tab.program}, ${live ? "live" : "viewing"} frame ${frame}`;
        const pre = renderGrid(screenAt(tab, frame), { label, live: live && !dim, dim, cursor: !exited });
        // Decision: the ring takes the warning tone, the one the sidebar's `human` chip has.
        if (tab.control === "human" && live && !compact)
          return `<div data-terminal-input data-tab="${esc(key)}" data-fk="terminal:${esc(key)}" tabindex="0" role="application" aria-roledescription="terminal" aria-label="Terminal ${esc(
            tabName(tab),
          )}, you have control" aria-describedby="control-hint" class="rounded-[2px] ring-2 ring-warning ring-offset-4 ring-offset-background outline-none focus-visible:ring-[3px]">${pre}</div>`;
        if (tab.control === "human" && live) return `<div class="rounded-[2px] ring-2 ring-warning ring-offset-2 ring-offset-background">${pre}</div>`;
        return pre;
      };

      /** The exit bar over the last frame (dimmed): what exited, with what code, Restart and Close tab. */
      const exitBar = (tab, compact) =>
        `<div role="status" class="${cn(
          "absolute inset-x-0 mx-auto flex w-fit max-w-[calc(100%-2rem)] flex-wrap items-center justify-center gap-x-3 gap-y-2 rounded-xl bg-popover px-3 py-2 text-xs text-popover-foreground shadow-lg ring-1 ring-foreground/10",
          compact ? "bottom-2" : "bottom-4",
        )}"><span><span class="font-mono">${esc(tab.program)}</span> exited with code <span class="${cn("font-mono", tab.exitCode ? "text-destructive" : "")}">${esc(
          String(tab.exitCode),
        )}</span></span>${
          compact
            ? ""
            : `<span class="flex gap-2">${btn({ label: "Restart", size: "sm", icon: "rotate-cw", action: "restart", id: tabKey(tab), fk: `exit-restart:${tabKey(tab)}` })}${btn(
                {
                  label: "Close tab",
                  variant: "ghost",
                  size: "sm",
                  action: "close-tab",
                  id: tabKey(tab),
                },
              )}</span>`
        }</div>`;

      const renderViewport = (tab) => {
        if (tab.stream === "loading")
          return `<div id="viewport-region" class="term-box relative flex min-h-0 flex-1 items-center justify-center overflow-hidden"><p class="flex items-center gap-2 text-xs text-muted-foreground">${icon(
            "loader-circle",
            "animate-spin text-[14px]",
          )}Waiting for first frame...</p></div>`;
        return `<div id="viewport-region" class="term-box relative flex min-h-0 flex-1 items-center justify-center overflow-hidden">${terminalView(tab)}${
          tab.status === "exited" && isLive(tab) ? exitBar(tab, false) : ""
        }</div>`;
      };

      /* ---------- the timeline (open point 3: under the viewport, per tab) ---------- */

      /** Decision: ticks differ by shape, not only colour: a call is a short line, a shell command a tall bar, a screenshot a square. */
      const TICK = {
        call: "top-[9px] h-1.5 w-px bg-muted-foreground/70",
        command: "top-[7px] h-2.5 w-0.5 bg-foreground/60",
        shot: "top-[10px] size-1 rounded-[1px] bg-foreground",
      };
      const liveButton = (tab) => {
        const live = isLive(tab);
        return `<button type="button" id="live-btn" data-action="go-live" data-id="${esc(tabKey(tab))}" data-fk="go-live:${esc(tabKey(tab))}" aria-pressed="${live}" class="${cn(
          "flex h-6 shrink-0 items-center gap-1.5 rounded border px-1.5 text-[10px] transition-colors outline-none focus-visible:ring-2 focus-visible:ring-ring/50",
          live ? "border-border text-foreground" : "border-border text-muted-foreground hover:text-foreground",
        )}">${dot(live ? "success" : "muted", "size-1.5")}Live</button>`;
      };
      const frameText = (tab, frame) => `frame ${frame} · ${fmtSec(timeAt(tab, frame))}`;
      /** Decision: the timeline sits in its own row under the terminal, with Live at its end; split view has none (each cell is live). */
      const renderTimeline = (tab) => {
        const max = Math.max(tab.frame, 1);
        const frame = shownFrame(tab);
        const pos = (f) => `calc(5px + (100% - 10px) * ${max > 1 ? (f - 1) / (max - 1) : 0})`;
        const ticks = ticksOf(tab)
          .map((t) => `<span class="absolute -translate-x-1/2 ${TICK[t.kind]}" style="left: ${pos(Math.min(t.frame, max))}"></span>`)
          .join("");
        return `<div class="flex shrink-0 items-center gap-2 border-t border-border px-3 py-0.5"><div class="relative min-w-0 flex-1"><div aria-hidden="true" class="pointer-events-none absolute inset-0">${ticks}</div><input type="range" class="scrub relative" min="1" max="${max}" step="1" value="${frame}" data-scrub data-tab="${esc(
          tabKey(tab),
        )}" data-fk="scrub:${esc(tabKey(tab))}" aria-label="Timeline of ${esc(tabName(tab))}" aria-valuetext="${esc(frameText(tab, frame))}" ${
          max <= 1 || tab.stream === "loading" ? "disabled" : ""
        } /></div>${liveButton(tab)}</div>`;
      };

      /* ---------- the status bar ---------- */

      const MODE_CHIPS = (modes) =>
        [modes.alt && "alt-screen", modes.mouse !== "off" && `mouse ${modes.mouse}`, modes.paste && "bracketed paste"].filter(Boolean);
      /**
       * Decision: the label is agent-browser's (Live, Connected while the first frame is coming, Reconnecting…), plus Exited and
       * "Viewing frame N · time" (grey dot) away from live. The frame chip shows only while live; the label names the frame otherwise.
       */
      const renderStatusBar = (tab) => {
        const live = isLive(tab);
        let tone = "success";
        let label = "Live";
        if (tab.stream === "reconnecting") [tone, label] = ["warning", "Reconnecting…"];
        else if (tab.stream === "loading") [tone, label] = ["success", "Connected"];
        else if (!live) [tone, label] = ["muted", `Viewing ${frameText(tab, shownFrame(tab))}`];
        else if (tab.status === "exited") [tone, label] = ["muted", "Exited"];
        const modes = MODE_CHIPS(tab.modes);
        const chips = [`${tab.size.cols} × ${tab.size.rows}`, ...modes, ...(live && tab.stream === "live" ? [`frame ${tab.frame}`] : [])];
        const hint =
          tab.control === "human" && live
            ? `<span id="control-hint" class="text-[10px] text-muted-foreground">Keys go to ${esc(tab.program)} · ctrl+p ctrl+q moves focus out</span>`
            : "";
        return `<div id="status-region" class="flex shrink-0 flex-wrap items-center gap-x-2 gap-y-1 px-3 py-2">${dot(tone)}<span class="text-xs text-muted-foreground">${esc(
          label,
        )}</span><span class="font-mono text-xs break-all text-muted-foreground/60">${esc(streamUrl(tab))}</span><div class="ml-auto flex flex-wrap items-center gap-2">${hint}${chips
          .map((c) => badge(esc(c), "outline"))
          .join("")}</div></div>`;
      };

      /** Scrubbing redraws only the terminal, the status bar and Live: re-rendering the range under the pointer would drop the drag. */
      const refreshTerminal = (tab) => {
        const swap = (id, html) => {
          const el = document.getElementById(id);
          if (el) el.outerHTML = html;
        };
        swap("viewport-region", renderViewport(tab));
        swap("status-region", renderStatusBar(tab));
        swap("live-btn", liveButton(tab));
        const range = document.querySelector(`[data-scrub][data-tab="${CSS.escape(tabKey(tab))}"]`);
        if (range) {
          range.value = String(shownFrame(tab));
          range.setAttribute("aria-valuetext", frameText(tab, shownFrame(tab)));
        }
      };

      /* ============================================================================
       * The side panel (should become components/side-panel.tsx): agent-browser's line tabs, here Activity · Commands ·
       * Screenshots · Output · Info, about the tab shown (or the split's focused cell). No Chat tab (open point 2).
       * ========================================================================== */

      const PANEL_TABS = [
        ["activity", "Activity"],
        ["commands", "Commands"],
        ["screenshots", "Screenshots"],
        ["output", "Output"],
        ["info", "Info"],
      ];
      /**
       * TabsTrigger, line variant, as the dashboard merges it (text-[11px], the underline at the list's bottom). Not in the app: the
       * list is h-8, not h-7, so each tab is 24px high, and px-1 with gap-0.5 so five tabs fit a 30% panel; it scrolls sideways when
       * the panel is narrower still.
       */
      const TAB_TRIGGER =
        "relative inline-flex h-[calc(100%-1px)] flex-1 items-center justify-center gap-1.5 rounded-md border border-transparent px-1 py-0.5 text-[11px] font-medium whitespace-nowrap text-foreground/60 transition-all outline-none hover:text-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50 dark:text-muted-foreground dark:hover:text-foreground after:absolute after:inset-x-0 after:bottom-[-4px] after:h-0.5 after:bg-foreground after:opacity-0 after:transition-opacity aria-selected:text-foreground dark:aria-selected:text-foreground aria-selected:after:opacity-100";
      const PANEL_HEAD = "flex shrink-0 items-center gap-2 px-3 py-2";
      const PANEL_TITLE = "text-xs font-normal text-muted-foreground";
      /** The Activity header's toggle and clear (`flex h-5 … rounded border px-1.5 text-[10px]`). Not in the app: h-6, for 24px. */
      const HEAD_TOGGLE =
        "flex h-6 min-w-6 items-center justify-center gap-1 rounded border border-border px-1.5 text-[10px] text-muted-foreground transition-colors outline-none hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring/50 aria-pressed:text-foreground";
      const emptyNote = (title, body = "") =>
        `<div class="px-6 py-8 text-center text-xs text-muted-foreground"><p>${title}</p>${body ? `<div class="mt-2 text-muted-foreground/70">${body}</div>` : ""}</div>`;
      /** A CLI line with its copy button (empty states, the dialog). */
      const cliBlock = (line, fk) =>
        `<div class="mx-auto mt-2 flex max-w-full items-center gap-2 rounded-md bg-muted px-2.5 py-1 text-left"><code class="min-w-0 flex-1 font-mono text-[11px] break-all text-foreground">${esc(
          line,
        )}</code>${copyBtn(line, `Copy ${line}`, fk)}</div>`;

      /** A small rendering of a frame (the Activity thumbnail, the gallery). */
      const thumbOf = (tab, frame, label) => {
        const g = screenAt(tab, frame);
        return `<div class="term-box w-full overflow-hidden rounded-sm" style="aspect-ratio: ${g.cols * 0.6} / ${g.rows * 1.2}">${renderGrid(g, { label, thumb: true, cursor: false })}</div>`;
      };

      /* ---------- Activity: every CLI call, newest at the bottom, following ---------- */

      /**
       * Decision: a call that succeeded carries no result word (its absence is the ok); the others say what happened under the
       * command, in their tone: timeout, exit 2 expect failed, exit N (exec --check), exit 5 process exited (destructive);
       * refused: human has control (warning); waiting (a call still pending, such as wait --control).
       */
      const resultOf = (res) => {
        if (!res) return null;
        if (res.kind === "timeout") return { label: "timeout", cls: "text-destructive", row: "bg-destructive/5" };
        if (res.kind === "assert") return { label: "exit 2 expect failed", cls: "text-destructive", row: "bg-destructive/5" };
        if (res.kind === "exit") return { label: `exit ${res.code}`, cls: "text-destructive", row: "bg-destructive/5" };
        if (res.kind === "exited") return { label: "exit 5 process exited", cls: "text-destructive", row: "bg-destructive/5" };
        if (res.kind === "refused") return { label: "refused: human has control", cls: "text-yellow-700 dark:text-warning", row: "bg-warning/5" };
        return { label: "waiting", cls: "text-muted-foreground", row: "", spinner: true };
      };

      const activityRow = (tab, row) => {
        const key = tabKey(tab);
        const res = resultOf(row.res);
        const expanded = UI.expanded[key] === row.id;
        const thumb = row.shot
          ? `<div class="mb-1.5 flex gap-2"><span class="invisible shrink-0 font-mono text-xs" aria-hidden="true">00:00:00.000</span><button type="button" data-action="open-shot" data-id="${esc(
              row.shot,
            )}" data-session="${esc(tab.session)}" data-fk="thumb:${esc(row.id)}" class="block w-40 max-w-full rounded-sm outline-none ring-1 ring-border hover:ring-ring focus-visible:ring-2 focus-visible:ring-ring"><span class="sr-only">Open screenshot ${esc(
              row.shot,
            )}</span>${thumbOf(tab, row.frame, row.shot)}</button></div>`
          : "";
        // Open point 4, Decision: a human's keystrokes are logged, in their own tone (violet), prefixed human:; typing extends one row.
        const who = row.human ? `<span class="text-violet-600 dark:text-violet-400">human:</span> ` : "";
        const duration = row.human || res?.spinner ? "" : `<span class="ml-1 whitespace-nowrap text-muted-foreground">${fmtDuration(row.ms)}</span>`;
        return `<li class="${cn("border-b border-border", res?.row, row.human && "bg-violet-500/5", expanded && "bg-muted/60")}"><div class="px-3"><button type="button" data-action="activity-row" data-id="${esc(
          row.id,
        )}" data-tab="${esc(key)}" data-fk="row:${esc(row.id)}" ${row.out ? `aria-expanded="${expanded}"` : ""} class="flex w-full items-start gap-2 rounded-sm py-1.5 text-left text-xs outline-none focus-visible:ring-2 focus-visible:ring-ring/50"><span class="shrink-0 font-mono text-muted-foreground">${timeEl(
          row.t,
          fmtMs(row.t),
        )}</span><span class="min-w-0 flex-1 font-mono [overflow-wrap:anywhere]">${who}${esc(row.cmd)}${duration}${
          res
            ? `<span class="mt-0.5 flex items-center gap-1 ${res.cls}">${res.spinner ? icon("loader-circle", "animate-spin text-[11px]") : ""}${esc(res.label)}</span>`
            : ""
        }</span>${row.out ? `<span class="ml-auto shrink-0 font-mono text-muted-foreground" aria-hidden="true">${expanded ? "-" : "+"}</span>` : ""}</button>${thumb}${
          expanded && row.out ? `<pre class="mb-1.5 max-h-48 overflow-auto text-[10px] leading-snug text-muted-foreground">${esc(row.out)}</pre>` : ""
        }</div></li>`;
      };

      /** Decision: the header's toggle is Follow (agent-browser's is Off for persistence); scrolling up pauses it and offers Jump to latest. Empty: "Waiting for calls...", after agent-browser's "Waiting for events...". */
      const renderActivity = (tab) => {
        const key = tabKey(tab);
        const rows = visibleActivity(tab);
        const head = `<div class="${PANEL_HEAD}"><h2 class="${PANEL_TITLE}">Activity</h2>${badge(String(rows.length), "secondary", "ml-auto")}<button type="button" data-action="follow" data-fk="follow" aria-pressed="${
          UI.follow
        }" class="${HEAD_TOGGLE}" title="Follow the newest call">${icon("arrow-down-to-line", "text-[12px]")}Follow</button><button type="button" data-action="clear-activity" data-id="${esc(
          key,
        )}" data-fk="clear-activity" class="${HEAD_TOGGLE}" title="Clear activity" ${rows.length ? "" : "disabled"}>${icon("trash-2", "text-[12px]")}<span class="sr-only">Clear activity</span></button></div>${SEP}`;
        if (!rows.length) return `${head}<p class="py-8 text-center text-xs text-muted-foreground">Waiting for calls...</p>`;
        return `${head}<div class="relative min-h-0 flex-1"><ol data-scroll-key="activity:${esc(key)}" data-follow-log data-follow="${UI.follow}" aria-label="Calls to ${esc(
          tabName(tab),
        )}" class="h-full overflow-y-auto">${rows.map((row) => activityRow(tab, row)).join("")}</ol><button type="button" id="jump-latest" data-action="jump-latest" data-fk="jump-latest" ${
          UI.follow ? "hidden" : ""
        } class="absolute bottom-3 left-1/2 flex h-6 -translate-x-1/2 items-center gap-1 rounded-4xl border border-border bg-popover px-2.5 text-[11px] text-popover-foreground shadow-md outline-none hover:bg-muted focus-visible:ring-2 focus-visible:ring-ring/50">${icon(
          "arrow-down",
          "text-[12px]",
        )}Jump to latest</button></div>`;
      };

      /* ---------- Commands: shell history from OSC 133 ---------- */

      /** Decision: oldest first, newest at the bottom, as Activity; ✓ or ✗ with the code, command, then cwd · duration · start time. */
      const commandRow = (tab, c) => {
        const key = tabKey(tab);
        const ok = c.exit === 0;
        const open = UI.cmdOpen[key] === c.id;
        const output = tab.lines
          .slice(c.from + 1, c.to)
          .map((line) => `<div class="min-h-[1lh] whitespace-pre-wrap">${markupHtml(line.m)}</div>`)
          .join("");
        return `<li class="${cn("border-b border-border", !ok && "bg-destructive/5", open && "bg-muted/60")}"><div class="px-3"><button type="button" data-action="command-row" data-id="${esc(
          c.id,
        )}" data-tab="${esc(key)}" data-fk="cmd:${esc(key)}:${esc(c.id)}" aria-expanded="${open}" class="flex w-full items-start gap-2 rounded-sm py-1.5 text-left text-xs outline-none focus-visible:ring-2 focus-visible:ring-ring/50"><span class="${cn(
          "w-12 shrink-0 font-mono",
          ok ? "text-green-600 dark:text-success" : "text-destructive",
        )}"><span aria-hidden="true">${ok ? "✓" : `✗ ${c.exit}`}</span><span class="sr-only">exit ${c.exit}</span></span><span class="min-w-0 flex-1"><span class="block font-mono [overflow-wrap:anywhere]">${esc(
          c.cmd,
        )}</span><span class="mt-0.5 block font-mono text-[10px] break-all text-muted-foreground">${esc(shortPath(c.cwd))} · ${fmtDuration(c.ms)} · ${timeEl(
          c.start,
          fmtSec(c.start),
        )}</span></span><span class="ml-auto shrink-0 font-mono text-muted-foreground" aria-hidden="true">${open ? "-" : "+"}</span></button>${
          open
            ? `<div class="mb-1.5 max-h-64 overflow-auto rounded-md bg-muted/50 px-2 py-1.5 font-mono text-[10px] leading-snug">${output || '<span class="text-muted-foreground">No output</span>'}</div>`
            : ""
        }</div></li>`;
      };

      const renderCommands = (tab) => {
        const head = (count) =>
          `<div class="${PANEL_HEAD}"><h2 class="${PANEL_TITLE}">Commands</h2>${count === null ? "" : badge(String(count), "secondary", "ml-auto")}</div>${SEP}`;
        // Decision: the two empty states say why there is no history and what gives one, nothing more.
        if (!tab.shell)
          return `${head(null)}${emptyNote(`${esc(tab.program)} is not a shell`, `Commands come from shell tabs, opened with ${cliBlock("agent-terminal shell", "copy-shell")}`)}`;
        if (!tab.integration)
          return `${head(null)}${emptyNote(
            "Shell integration is off for this tab",
            `Commands are recorded in shells opened with integration: ${cliBlock(`agent-terminal --session ${tab.session} shell`, "copy-shell")}`,
          )}`;
        if (!tab.commands.length) return `${head(0)}${emptyNote("No commands yet")}`;
        return `${head(tab.commands.length)}<ol data-scroll-key="commands:${esc(tabKey(tab))}" aria-label="Commands in ${esc(tabName(tab))}" class="min-h-0 flex-1 overflow-y-auto">${tab.commands
          .map((c) => commandRow(tab, c))
          .join("")}</ol>`;
      };

      /* ---------- Screenshots: the session's gallery ---------- */

      const renderScreenshots = (tab) => {
        const shots = screenshotsOf(tab.session);
        const head = `<div class="${PANEL_HEAD}"><h2 class="${PANEL_TITLE}">Screenshots</h2>${badge(String(shots.length), "secondary", "ml-auto")}</div>${SEP}`;
        if (!shots.length) return `${head}${emptyNote("No screenshots yet")}`;
        return `${head}<ul data-scroll-key="shots:${esc(tab.session)}" aria-label="Screenshots of ${esc(tab.session)}" class="grid min-h-0 flex-1 grid-cols-[repeat(auto-fill,minmax(9rem,1fr))] content-start gap-2 overflow-y-auto p-2">${shots
          .map(
            (shot) =>
              `<li><button type="button" data-action="open-shot" data-id="${esc(shot.file)}" data-session="${esc(tab.session)}" data-fk="shot:${esc(
                shot.file,
              )}" class="flex w-full flex-col gap-1 rounded-md p-1.5 text-left outline-none hover:bg-muted focus-visible:ring-2 focus-visible:ring-ring/50">${thumbOf(
                shot.tab,
                shot.frame,
                shot.file,
              )}<span class="mt-0.5 font-mono text-[11px] break-all">${esc(shot.file)}</span><span class="text-[10px] text-muted-foreground">${esc(shot.tab.id)} · frame ${shot.frame} · ${timeEl(
                shot.t,
                fmtSec(shot.t),
              )}</span><span class="font-mono text-[10px] break-all text-muted-foreground">${esc(shot.by)}</span></button></li>`,
          )
          .join("")}</ul>`;
      };

      /* ---------- Output: the text stream, marks as dividers, Raw, search ---------- */

      /** A line's raw bytes, escapes made visible: OSC 133 around prompts and commands in a shell with integration. */
      const rawOf = (tab, line) => {
        if (line.raw) return line.raw;
        if (line.p !== undefined && tab.integration)
          return `␛]133;D;${line.prevExit}␇␛]133;A␇${markupRaw(line.p)}␛]133;B␇${line.cmd}${line.cmd ? "␍␊␛]133;C␇" : ""}`;
        return `${markupRaw(line.m)}␍␊`;
      };
      const highlight = (text, query) => {
        if (!query) return esc(text);
        const lower = text.toLowerCase();
        const q = query.toLowerCase();
        let out = "";
        let i = 0;
        for (let at = lower.indexOf(q); at !== -1; at = lower.indexOf(q, i)) {
          out += `${esc(text.slice(i, at))}<mark class="rounded-[2px] bg-yellow-300 text-black">${esc(text.slice(at, at + q.length))}</mark>`;
          i = at + q.length;
        }
        return out + esc(text.slice(i));
      };
      const renderOutput = (tab) => {
        const query = UI.outputQuery.trim();
        const textOf = (line) => (UI.outputRaw ? rawOf(tab, line) : plainOf(line.m));
        const matches = query ? tab.lines.reduce((n, line) => n + (textOf(line).toLowerCase().split(query.toLowerCase()).length - 1), 0) : 0;
        const markAt = new Map();
        tab.marks.forEach((mark) => {
          const index = tab.lines.filter((line) => line.f <= mark.f).length;
          markAt.set(index, [...(markAt.get(index) ?? []), mark.name]);
        });
        const body = [];
        tab.lines.forEach((line, i) => {
          (markAt.get(i) ?? []).forEach((name) => body.push(markDivider(name)));
          // Decision: while searching, lines lose their colours so the matches stand out; Raw shows the bytes as written.
          const html = query || UI.outputRaw ? highlight(textOf(line), query) : markupHtml(line.m);
          body.push(`<div class="min-h-[1lh] whitespace-pre-wrap break-all">${html}</div>`);
        });
        (markAt.get(tab.lines.length) ?? []).forEach((name) => body.push(markDivider(name)));
        return `<div class="${PANEL_HEAD} flex-wrap"><h2 class="${PANEL_TITLE}">Output</h2><label class="ml-auto flex h-6 min-w-24 flex-1 items-center gap-1.5 rounded border border-border px-1.5 text-muted-foreground focus-within:ring-2 focus-within:ring-ring/50">${icon(
          "search",
          "text-[12px]",
        )}<span class="sr-only">Search the output</span><input type="text" data-bind="u:outputQuery" data-rerender data-fk="output-search" value="${esc(
          UI.outputQuery,
        )}" placeholder="Search" spellcheck="false" autocomplete="off" class="min-w-0 flex-1 bg-transparent text-[11px] text-foreground outline-none placeholder:text-muted-foreground/60" /></label>${
          query
            ? `<span class="text-[10px] whitespace-nowrap text-muted-foreground" role="status">${matches} ${matches === 1 ? "match" : "matches"}</span>`
            : ""
        }<button type="button" data-action="toggle-raw" data-fk="toggle-raw" aria-pressed="${UI.outputRaw}" class="${HEAD_TOGGLE}" title="Show escape sequences">Raw</button></div>${SEP}${
          tab.lines.length
            ? `<div data-scroll-key="output:${esc(tabKey(tab))}" class="min-h-0 flex-1 overflow-y-auto px-3 py-2 font-mono text-[11px] leading-relaxed">${body.join("")}</div>`
            : emptyNote("No output yet")
        }`;
      };
      const markDivider = (name) =>
        `<div role="separator" aria-label="mark ${esc(name)}" class="my-1.5 flex items-center gap-2 font-sans text-[10px] text-muted-foreground"><span class="h-px flex-1 bg-border"></span>mark: ${esc(
          name,
        )}<span class="h-px flex-1 bg-border"></span></div>`;

      /* ---------- Info ---------- */

      const MODE_ROWS = (m) => [
        ["alt-screen", m.alt ? "on" : "off"],
        ["mouse tracking", m.mouse === "off" ? "off" : `on (${m.mouse})`],
        ["bracketed paste", m.paste ? "on" : "off"],
        ["application cursor keys", m.appCursor ? "on" : "off"],
        ["focus events", m.focus ? "on" : "off"],
        ["kitty keyboard flags", m.kitty ? String(m.kitty) : "off"],
      ];
      const dl = (rows, mono = true) =>
        `<dl class="grid grid-cols-[minmax(7rem,auto)_minmax(0,1fr)] gap-x-4 gap-y-1.5 text-xs">${rows
          .map(([k, v]) => `<dt class="text-muted-foreground">${esc(k)}</dt><dd class="${cn(mono && "font-mono", "break-all")}">${v}</dd>`)
          .join("")}</dl>`;
      const renderInfo = (tab) => {
        const [program, ...args] = tab.program.split(" ");
        const onOff = (on) => (on ? "on" : `<span class="text-muted-foreground">off</span>`);
        const general = [
          ["program", esc(program)],
          ["args", args.length ? esc(args.join(" ")) : `<span class="text-muted-foreground">none</span>`],
          ["pid", `${tab.pid}${tab.status === "exited" ? ` <span class="text-muted-foreground">(exited ${tab.exitCode})</span>` : ""}`],
          ["cwd", esc(tab.cwd)],
          ["TERM", esc(tab.term)],
          ["size", `${tab.size.cols} × ${tab.size.rows}`],
          ["shell integration", tab.shell ? onOff(tab.integration) : `<span class="text-muted-foreground">not a shell</span>`],
          ["recording", tab.rec ? esc(tab.rec.path) : `<span class="text-muted-foreground">off</span>`],
          ["started", timeEl(tab.startedAt, fmtDateTime(tab.startedAt))],
        ];
        const env = tab.env.map(([k, v]) =>
          v === "••••"
            ? [k, `<span aria-hidden="true">••••</span><span class="sr-only">masked</span> ${icon("lock", "text-[11px] text-muted-foreground")}`]
            : [k, esc(v)],
        );
        return `<div class="${PANEL_HEAD}"><h2 class="${PANEL_TITLE}">Info</h2></div>${SEP}<div data-scroll-key="info:${esc(
          tabKey(tab),
        )}" class="min-h-0 flex-1 space-y-4 overflow-y-auto px-3 py-3">${dl(general)}<section aria-labelledby="modes-title"><h3 id="modes-title" class="mb-1.5 text-[11px] font-medium text-muted-foreground">Modes</h3>${dl(
          MODE_ROWS(tab.modes).map(([k, v]) => [k, v === "off" ? `<span class="text-muted-foreground">off</span>` : esc(v)]),
          true,
        )}</section><details class="group"><summary class="flex h-6 items-center gap-1 text-[11px] font-medium text-muted-foreground outline-none hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring/50">${icon(
          "chevron-right",
          "text-[12px] transition-transform group-open:rotate-90",
        )}Environment <span class="font-normal">(${tab.env.length})</span></summary><div class="mt-1.5">${dl(env)}</div></details></div>`;
      };

      const PANEL_BODY = { activity: renderActivity, commands: renderCommands, screenshots: renderScreenshots, output: renderOutput, info: renderInfo };
      const renderSidePanel = (tab) =>
        `<section aria-label="Details of ${esc(tabName(tab))}" class="col-right flex min-h-0 shrink-0 flex-col gap-2" style="width: ${UI.rightPct}%; min-width: 19.5rem; max-width: 50%"><div class="shrink-0 px-2 pt-1"><div role="tablist" aria-label="Details" class="flex h-8 w-full items-center gap-0.5 overflow-x-auto p-[3px] text-muted-foreground">${PANEL_TABS.map(
          ([id, label]) =>
            `<button type="button" role="tab" id="ptab-${id}" aria-controls="ppanel-${id}" aria-selected="${UI.panelTab === id}" tabindex="${
              UI.panelTab === id ? "0" : "-1"
            }" data-action="panel-tab" data-id="${id}" data-fk="ptab:${id}" class="${TAB_TRIGGER}">${label}</button>`,
        ).join(
          "",
        )}</div></div><div role="tabpanel" id="ppanel-${UI.panelTab}" aria-labelledby="ptab-${UI.panelTab}" class="flex min-h-0 flex-1 flex-col text-sm">${PANEL_BODY[
          UI.panelTab
        ](tab)}</div></section>`;

      /* ============================================================================
       * Screens: one tab (#/s/:session/:tab), the split grid (#/split/a,b[,c,d]), the empty dashboard, the daemon down.
       * ========================================================================== */

      /* ---------- one tab (should become app/page.tsx's viewport column) ---------- */

      const screenTab = (sessionName, id) => {
        if (S.daemon === "down") return screenDaemonDown();
        const tab = findTab(`${sessionName}/${id}`);
        if (!tab)
          return {
            title: "Not open",
            h1: "Not open",
            center: `<div class="flex h-full items-center justify-center p-6 text-center"><div class="space-y-2"><p class="text-sm text-muted-foreground">${esc(
              `${sessionName} ${id}`,
            )} is not open</p><p class="text-xs"><a href="#/" class="text-muted-foreground underline underline-offset-4 hover:text-foreground">Show open sessions</a></p></div></div>`,
          };
        return {
          title: `${tabName(tab)} · ${tab.program}`,
          h1: `${tabName(tab)} · ${tab.program}`,
          current: tab,
          center: `${renderToolbar(tab, 1)}${SEP}${renderViewport(tab)}${renderTimeline(tab)}${SEP}${renderStatusBar(tab)}`,
          right: renderSidePanel(tab),
        };
      };

      /* ---------- split view (should become components/split-view.tsx) ---------- */

      /** "qa:t1,qa:t2,_": the cells of a split route, a tab key or null for an empty cell. */
      const splitCells = (spec) => spec.split(",").map((cell) => (cell === "_" ? null : cell.replace(":", "/")));
      const splitRoute = (cells) => `/split/${cells.map((key) => (key ? key.replace("/", ":") : "_")).join(",")}`;
      const currentSplit = () => (currentPath().startsWith("/split/") ? splitCells(currentPath().slice(7)) : null);

      const splitCell = (key, i) => {
        const tab = key ? findTab(key) : null;
        if (!tab) return pickerCell(i);
        const focused = i === UI.splitFocus;
        const state = tabState(tab);
        // Decision: the mini header reads session / tab program, then the state chip; a click anywhere on the cell focuses it.
        return `<section aria-label="${esc(`${tabName(tab)} ${tab.program}`)}" data-action="split-focus" data-id="${i}" class="${cn(
          "flex min-h-0 min-w-0 flex-col bg-background",
          focused && "ring-1 ring-foreground/40 ring-inset",
        )}"><div class="flex shrink-0 items-center gap-1 border-b border-border px-1.5 py-0.5 text-[11px]"><button type="button" data-action="split-focus" data-id="${i}" data-fk="cell:${i}" aria-pressed="${focused}" class="flex min-w-0 flex-1 flex-wrap items-center gap-x-1.5 rounded px-1 py-1 text-left outline-none hover:bg-muted focus-visible:ring-2 focus-visible:ring-ring/50">${tabGlyph(
          tab,
        )}<span class="font-mono font-semibold">${esc(tab.session)}</span><span class="text-muted-foreground" aria-hidden="true">/</span><span class="font-mono">${esc(
          tab.id,
        )}</span><span class="break-all text-muted-foreground">${esc(tab.program)}</span>${tabChip(tab)}<span class="sr-only">, ${esc(state.label)}</span></button><a href="#/s/${esc(
          tab.session,
        )}/${esc(tab.id)}" data-fk="cell-max:${i}" data-tooltip="Maximize" class="${TOOL_BTN}">${icon("maximize-2", "text-[14px]")}<span class="sr-only">Maximize ${esc(
          tabName(tab),
        )}</span></a>${iconBtn({ action: "split-remove", id: String(i), label: `Remove ${tabName(tab)} from the grid`, icon: "x", tooltip: "Remove" })}</div><div class="term-box relative flex min-h-0 flex-1 items-center justify-center overflow-hidden">${terminalView(
          tab,
          { compact: !focused },
        )}${tab.status === "exited" ? exitBar(tab, true) : ""}</div></section>`;
      };

      /** An empty cell lists every open tab to show in it (Decision: inline in the cell, no popover; tabs already shown are disabled). */
      const pickerCell = (i) => {
        const shown = new Set(currentSplit()?.filter(Boolean) ?? []);
        return `<section aria-labelledby="pick-${i}" class="flex min-h-0 min-w-0 flex-col items-center justify-center gap-2 overflow-y-auto bg-background p-4"><h2 id="pick-${i}" class="text-xs font-normal text-muted-foreground">Show a terminal</h2><ul class="w-full max-w-64 overflow-hidden rounded-md border border-border text-xs">${S.sessions
          .map(
            (session) =>
              `<li><p class="bg-muted/50 px-2.5 py-1 font-mono text-[11px] font-semibold text-muted-foreground">${esc(session.name)}</p><ul>${session.tabs
                .map((tab) => {
                  const key = tabKey(tab);
                  const isShown = shown.has(key);
                  return `<li><button type="button" data-action="split-pick" data-id="${i}" data-tab="${esc(key)}" data-fk="pick:${i}:${esc(key)}" ${
                    isShown ? "disabled" : ""
                  } class="flex min-h-7 w-full items-center gap-2 px-2.5 py-1 text-left outline-none hover:bg-muted focus-visible:bg-muted disabled:opacity-50">${tabGlyph(
                    tab,
                  )}<span class="font-mono">${esc(tab.id)}</span><span class="min-w-0 flex-1 break-all text-muted-foreground">${esc(tab.program)}</span>${
                    isShown ? chip("shown") : tabChip(tab)
                  }<span class="sr-only">, ${esc(session.name)} ${esc(tab.id)}</span></button></li>`;
                })
                .join("")}</ul></li>`,
          )
          .join("")}</ul></section>`;
      };

      const screenSplit = (spec) => {
        if (S.daemon === "down") return screenDaemonDown();
        const cells = splitCells(spec);
        if (![2, 4].includes(cells.length)) return screenNotFound();
        if (UI.splitFocus >= cells.length || !cells[UI.splitFocus]) UI.splitFocus = Math.max(0, cells.findIndex(Boolean));
        const focused = cells[UI.splitFocus] ? findTab(cells[UI.splitFocus]) : null;
        const grid = `<div class="split-grid grid min-h-0 flex-1 gap-px bg-border" style="grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: ${
          cells.length === 4 ? "repeat(2, minmax(0, 1fr))" : "minmax(0, 1fr)"
        }">${cells.map((key, i) => splitCell(key, i)).join("")}</div>`;
        return {
          title: `Split · ${cells.length} terminals`,
          h1: `Split view, ${cells.length} terminals`,
          split: true,
          current: focused,
          center: focused
            ? `${renderToolbar(focused, cells.length)}${SEP}${grid}${SEP}${renderStatusBar(focused)}`
            : `${renderLayoutOnlyToolbar(cells.length)}${SEP}${grid}`,
          right: focused ? renderSidePanel(focused) : "",
        };
      };

      /* ---------- empty dashboard and daemon down (agent-browser's "No active sessions" empty state) ---------- */

      /** Decision: the empty dashboard keeps agent-browser's sentence and button and adds the three commands that start a terminal. */
      const START_COMMANDS = ["agent-terminal open <program>", "agent-terminal shell", "agent-terminal skills get core"];
      const screenEmpty = () => ({
        title: "No active sessions",
        h1: "No active sessions",
        center: `<div class="flex h-full items-center justify-center p-6"><div class="w-full max-w-sm space-y-4 text-center"><div class="space-y-2"><p class="text-sm text-muted-foreground">No active sessions</p><p class="text-xs text-muted-foreground/60">Start a terminal from the CLI, or create a session here</p></div><ul class="space-y-1.5" aria-label="Commands to get started">${START_COMMANDS.map(
          (line, i) => `<li>${cliBlock(line, `start-copy:${i}`)}</li>`,
        ).join("")}</ul>${btn({ label: "New session", size: "sm", icon: "plus", action: "new-session", fk: "empty-new-session" })}</div></div>`,
      });
      /** Decision: "Disconnected" is agent-browser's own word for a lost stream; the hint is the one command that fixes it. */
      const screenDaemonDown = () => ({
        title: "Disconnected",
        h1: "Disconnected",
        center: `<div class="flex h-full items-center justify-center p-6"><div class="w-full max-w-sm space-y-4 text-center"><div class="space-y-2"><p class="flex items-center justify-center gap-2 text-sm text-muted-foreground">${dot(
          "destructive",
        )}Disconnected</p><p class="text-xs text-muted-foreground/60">The agent-terminal daemon is not running on :4849</p></div>${cliBlock(
          "agent-terminal dashboard start",
          "copy-start",
        )}${btn({ label: "Retry", variant: "outline", size: "sm", icon: "rotate-cw", action: "retry-daemon" })}</div></div>`,
      });
      /** The dashboard is a Next.js app: a path it does not have gets Next's default 404. */
      const screenNotFound = () => ({
        title: "404: This page could not be found",
        h1: "404",
        center: `<div class="flex h-full items-center justify-center text-center"><div><p class="mr-5 inline-block border-r border-foreground/30 pr-[23px] align-top text-2xl leading-[49px] font-medium">404</p><div class="inline-block"><p class="text-sm leading-[49px] font-normal">This page could not be found.</p></div></div></div>`,
      });

      /* ============================================================================
       * Dialogs: New session / New tab, Close all sessions, Restart, the screenshot lightbox with Compare.
       * ========================================================================== */

      /* ---------- New session / New tab (the dashboard's New session dialog, grown to a terminal's options) ---------- */

      const SIZE_PRESETS = ["80x24", "120x40", "200x60"];
      const sizeLabel = (preset) => preset.replace("x", "×");
      /** The CLI line the form is equivalent to: humans learn the CLI from the UI. */
      const cliLineOf = (f) => {
        const session = f.mode === "new" ? f.name.trim() || "<name>" : f.existing;
        const command = f.command.trim() || "<program>";
        const word = command.split(/\s+/)[0];
        const size = f.size === "custom" ? `${f.cols.trim() || "?"}x${f.rows.trim() || "?"}` : f.size;
        const cwd = f.cwd.trim() && f.cwd.trim() !== "~" ? ` --cwd ${f.cwd.trim()}` : "";
        // `shell` is `open` plus shell integration; the user's shell (zsh) needs no --shell.
        const verb = SHELLS.includes(word) && integrationOn(f) ? `shell${word === "zsh" ? "" : ` --shell ${word}`}` : `open ${command}`;
        return `agent-terminal --session ${session} ${verb}${cwd} --size ${size}`;
      };
      /** A segmented choice: native radios, drawn as the dialog's engine buttons (border-ring bg-muted when chosen). */
      const segmented = ({ name, legend, path, value, options, cols, error = "" }) =>
        `<fieldset class="grid gap-1.5" ${error ? `aria-describedby="${name}-error"` : ""}><legend class="${LABEL_CLS} mb-1.5">${esc(legend)}</legend><div class="grid gap-2" style="grid-template-columns: repeat(${cols}, minmax(0, 1fr))">${options
          .map(
            ([v, label]) =>
              `<label class="flex min-h-8 cursor-pointer items-center justify-center rounded-md border border-border px-2 py-1.5 text-center text-sm text-muted-foreground transition-colors hover:text-foreground has-checked:border-ring has-checked:bg-muted has-checked:text-foreground has-focus-visible:ring-2 has-focus-visible:ring-ring/50"><input type="radio" class="sr-only" name="${name}" value="${esc(
                v,
              )}" data-bind="o:${path}" data-rerender data-fk="radio:${name}:${esc(v)}" ${value === v ? "checked" : ""} />${esc(label)}</label>`,
          )
          .join("")}</div>${fieldError(`${name}-error`, error)}</fieldset>`;

      OVERLAYS["new-session"] = (o, isTop) => {
        const f = o.form;
        const e = o.errors ?? {};
        const word = f.command.trim().split(/\s+/)[0] ?? "";
        const shell = SHELLS.includes(word);
        const integration = shell && integrationOn(f);
        const sessionPart =
          f.mode === "new"
            ? textField({ id: `${o.id}-name`, label: "Session name", path: "form.name", value: f.name, error: e.name, autofocus: true, mono: true })
            : `<div class="grid gap-1.5"><label for="${o.id}-existing" class="${LABEL_CLS}">Session</label><select id="${o.id}-existing" data-bind="o:form.existing" data-rerender data-fk="field:form.existing" class="${INPUT_CLS} font-mono text-[13px]">${S.sessions
                .map((s) => `<option value="${esc(s.name)}" ${s.name === f.existing ? "selected" : ""}>${esc(s.name)}</option>`)
                .join("")}</select></div>`;
        const custom =
          f.size === "custom"
            ? `<div class="grid grid-cols-2 gap-2">${textField({ id: `${o.id}-cols`, label: "Columns", path: "form.cols", value: f.cols, mono: true })}${textField(
                {
                  id: `${o.id}-rows`,
                  label: "Rows",
                  path: "form.rows",
                  value: f.rows,
                  mono: true,
                },
              )}</div>`
            : "";
        const presets = SIZE_PRESETS.map((p) => [p, sizeLabel(p)]).concat([["custom", "Custom"]]);
        const integrationNote = shell ? "Records each command with its exit code" : "Shells only";
        const body = `${
          S.sessions.length
            ? segmented({
                name: "mode",
                legend: "Open in",
                path: "form.mode",
                value: f.mode,
                options: [
                  ["new", "New session"],
                  ["existing", "Existing session"],
                ],
                cols: 2,
              })
            : ""
        }${sessionPart}${textField({ id: `${o.id}-command`, label: "Command", path: "form.command", value: f.command, placeholder: "lazygit", error: e.command, mono: true, autofocus: f.mode === "existing" })}${textField(
          { id: `${o.id}-cwd`, label: "Working directory", path: "form.cwd", value: f.cwd, placeholder: "~", mono: true },
        )}${segmented({
          name: "size",
          legend: "Size",
          path: "form.size",
          value: f.size,
          options: presets,
          cols: 4,
          error: e.size,
        })}${custom}<div class="flex items-center justify-between gap-3"><div><p id="${o.id}-int-label" class="text-sm">Shell integration</p><p id="${o.id}-int-note" class="text-xs text-muted-foreground">${esc(
          integrationNote,
        )}</p></div><button type="button" role="switch" aria-checked="${integration}" aria-labelledby="${o.id}-int-label" aria-describedby="${o.id}-int-note" data-action="toggle-integration" data-fk="toggle-integration" ${
          shell ? "" : "disabled"
        } class="${cn(
          "relative inline-flex h-6 w-10 shrink-0 items-center rounded-full border border-transparent transition-colors outline-none focus-visible:ring-2 focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50",
          integration ? "bg-primary" : "bg-input",
        )}"><span class="${cn("block size-5 rounded-full bg-background shadow transition-transform", integration ? "translate-x-4" : "translate-x-0.5")}"></span></button></div><div class="grid gap-1.5"><p id="${o.id}-cli" class="${LABEL_CLS}">Same as</p><div class="flex items-start gap-2 rounded-md bg-muted px-2.5 py-1.5"><code aria-labelledby="${o.id}-cli" class="min-w-0 flex-1 font-mono text-xs leading-6 break-all">${esc(
          cliLineOf(f),
        )}</code>${copyBtn(cliLineOf(f), "Copy the command line", "copy-cli")}</div></div>`;
        const footer = `${btn({ label: "Cancel", variant: "ghost", size: "sm", action: "overlay-close", fk: `cancel:${o.id}` })}${btn({
          label: f.mode === "new" ? "Create" : "Open tab",
          size: "sm",
          type: "submit",
          fk: `submit:${o.id}`,
        })}`;
        return dialogShell(o, { title: f.mode === "new" ? "New session" : "New tab", body, footer, width: 28, submit: "new-session-submit", isTop });
      };
      /**
       * Decision: one dialog for New session and New tab (Open in: New session / Existing session). Labels: Session name, Command, Working
       * directory, Size, Shell integration ("Records each command with its exit code" / "Shells only"), Same as (the CLI line). A new
       * session is named session-N; a size is always written into the CLI line. Refusals: on the field (name empty, invalid, taken; command
       * empty; custom size out of range), and the daemon's "command not found: <word>" as a toast with the dialog left open on Command.
       */
      const openNewSession = (existing = null) =>
        openOverlay({
          type: "new-session",
          form: {
            mode: existing ? "existing" : "new",
            name: S.sessions.length ? `session-${S.sessions.length + 1}` : "qa",
            existing: existing ?? S.sessions[0]?.name ?? "",
            command: "",
            cwd: "~",
            size: "120x40",
            cols: "120",
            rows: "40",
            integration: null,
          },
          errors: {},
        });

      /* ---------- Close all sessions (the dashboard's dialog, with what will be killed) ---------- */

      const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
      OVERLAYS["close-all"] = (o, isTop) =>
        dialogShell(o, {
          title: "Close all sessions",
          description: `This will close ${plural(S.sessions.length, "session", "sessions")} and kill ${plural(runningCount(), "running process", "running processes")}. This action cannot be undone.`,
          footer: `${btn({ label: "Cancel", variant: "ghost", size: "sm", action: "overlay-close", fk: `cancel:${o.id}`, data: { "data-autofocus": true } })}${btn(
            {
              label: "Close all",
              variant: "destructive",
              size: "sm",
              action: "close-all-confirm",
            },
          )}`,
          width: 24,
          alert: true,
          isTop,
        });

      /* ---------- Restart a running program ---------- */

      /** Decision: restarting a running program asks first (it kills what an agent may be driving); an exited one restarts at once. */
      OVERLAYS.restart = (o, isTop) => {
        const tab = findTab(o.tab);
        return dialogShell(o, {
          title: `Restart ${esc(tab.program)}?`,
          description: `${esc(tabName(tab))} is killed and started again with the same command, size and working directory.`,
          footer: `${btn({ label: "Cancel", variant: "ghost", size: "sm", action: "overlay-close", fk: `cancel:${o.id}`, data: { "data-autofocus": true } })}${btn(
            {
              label: "Restart",
              size: "sm",
              action: "restart-confirm",
              id: o.tab,
            },
          )}`,
          width: 24,
          alert: true,
          isTop,
        });
      };

      /* ---------- the screenshot lightbox, with Compare (changed cells highlighted) ---------- */

      /** Decision: the lightbox shows the frame, path, tab, frame, time and the call that took it; Compare puts the older one on the left. */
      const shotFigure = (shot, grid, against, height) =>
        `<figure class="grid min-w-0 gap-1.5"><div class="term-box flex items-center justify-center rounded-md bg-background" style="height: ${height}">${renderGrid(
          grid,
          {
            label: `${shot.file}, frame ${shot.frame}`,
            diff: against,
            cursor: false,
          },
        )}</div><figcaption class="font-mono text-[11px] break-all">${esc(shot.file)} <span class="text-muted-foreground">· ${esc(shot.tab.id)} · frame ${shot.frame} · ${timeEl(
          shot.t,
          fmtSec(shot.t),
        )} · ${esc(shot.by)}</span></figcaption></figure>`;
      OVERLAYS.shot = (o, isTop) => {
        const shots = screenshotsOf(o.session);
        const shot = shots[o.index];
        const grid = screenAt(shot.tab, shot.frame);
        const path = `${SHOT_DIR}/${shot.file}`;
        let body;
        if (o.compare !== null) {
          const other = shots[o.compare];
          const otherGrid = screenAt(other.tab, other.frame);
          const sameSize = otherGrid.cols === grid.cols && otherGrid.rows === grid.rows;
          const [a, b] =
            o.compare < o.index
              ? [
                  [other, otherGrid],
                  [shot, grid],
                ]
              : [
                  [shot, grid],
                  [other, otherGrid],
                ];
          const count = sameSize ? changedCells(a[1], b[1]) : null;
          body = `<div class="@container grid gap-2"><p class="text-xs text-muted-foreground" role="status">${
            count === null ? "Different sizes: no cell comparison" : `${count} ${count === 1 ? "cell" : "cells"} changed`
          }</p><div class="grid grid-cols-1 gap-3 @2xl:grid-cols-2">${shotFigure(a[0], a[1], sameSize ? b[1] : null, "min(40vh, 22rem)")}${shotFigure(
            b[0],
            b[1],
            sameSize ? a[1] : null,
            "min(40vh, 22rem)",
          )}</div></div>`;
        } else body = shotFigure(shot, grid, null, "min(58vh, 34rem)");
        const comparePart =
          o.compare !== null
            ? btn({ label: "Back to screenshot", variant: "outline", size: "sm", action: "shot-back", fk: "shot-back" })
            : o.picking
              ? `<label class="sr-only" for="${o.id}-compare">Compare with</label><select id="${o.id}-compare" data-change="shot-compare" data-fk="shot-compare" data-autofocus class="h-7 rounded-md border border-border bg-transparent px-2 font-mono text-xs outline-none focus:ring-2 focus:ring-ring"><option value="">Compare with…</option>${shots
                  .map((s, i) => (i === o.index ? "" : `<option value="${i}">${esc(s.file)}</option>`))
                  .join("")}</select>`
              : btn({
                  label: "Compare with…",
                  variant: "outline",
                  size: "sm",
                  icon: "git-compare",
                  action: "shot-pick",
                  fk: "shot-pick",
                  disabled: shots.length < 2,
                });
        const footer = `<div class="flex flex-1 items-center gap-1">${iconBtn({ action: "shot-prev", label: "Previous screenshot", icon: "chevron-left", disabled: o.index === 0 || o.compare !== null })}<span class="text-xs tabular-nums text-muted-foreground">${
          o.index + 1
        } of ${shots.length}</span>${iconBtn({ action: "shot-next", label: "Next screenshot", icon: "chevron-right", disabled: o.index === shots.length - 1 || o.compare !== null })}</div>${btn(
          {
            label: "Copy path",
            variant: "ghost",
            size: "sm",
            icon: "copy",
            action: "copy",
            id: path,
            fk: "copy-path",
          },
        )}${comparePart}`;
        return dialogShell(o, {
          title: o.compare !== null ? `<span class="font-mono">${esc(shot.file)}</span> compared` : `<span class="font-mono">${esc(shot.file)}</span>`,
          body,
          footer,
          width: 72,
          isTop,
        });
      };
      const openShot = (session, file) => {
        const index = screenshotsOf(session).findIndex((s) => s.file === file);
        if (index < 0) return null;
        return openOverlay({ type: "shot", session, index, compare: null, picking: false });
      };

      /* ============================================================================
       * Actions: what each control does. Keyboard for a terminal a human controls, the follow-scroll of Activity, and the
       * resizable handles' pointer drag live here too.
       * ========================================================================== */

      /** The frame a tab shows from now on: a past frame, or live when it is the newest. */
      const setView = (tab, frame) => {
        if (frame >= tab.frame) delete UI.view[tabKey(tab)];
        else UI.view[tabKey(tab)] = Math.max(1, frame);
      };
      /** The tab the center shows (single view) or the split's focused cell. */
      const shownTab = () => {
        const split = currentSplit();
        if (split) return split[UI.splitFocus] ? findTab(split[UI.splitFocus]) : null;
        const m = currentPath().match(/^\/s\/([^/]+)\/([^/]+)$/);
        return m ? findTab(`${m[1]}/${m[2]}`) : null;
      };

      Object.assign(ACTIONS, {
        "theme-toggle": () => {
          UI.theme = UI.theme === "dark" ? "light" : "dark";
          applyTheme();
          render();
        },
        "new-session": () => openNewSession(),
        "new-tab": (el) => openNewSession(el.dataset.id),
        "close-all": () => openOverlay({ type: "close-all" }),
        "close-all-confirm": () => {
          const n = S.sessions.length;
          closeAllSessions();
          UI.overlays = [];
          renderOverlays();
          navigate("/");
          announce(`Closed ${plural(n, "session", "sessions")}`);
        },
        "toggle-session": (el) => {
          UI.collapsed[el.dataset.id] = !UI.collapsed[el.dataset.id];
          render();
        },
        "retry-daemon": () => {
          S.daemon = "up";
          navigate("/");
          announce("Connected");
        },
        "toggle-integration": () => {
          const o = topOverlay();
          o.form.integration = !integrationOn(o.form);
          refreshOverlay();
        },
        "new-session-submit": () => {
          const o = topOverlay();
          const f = o.form;
          const errors = {};
          if (f.mode === "new") {
            const name = f.name.trim();
            if (!name) errors.name = "Enter a session name.";
            else if (!/^[A-Za-z0-9_-]+$/.test(name)) errors.name = "Use letters, numbers, - and _.";
            else if (sessionOf(name)) errors.name = `A session named ${esc(name)} already exists.`;
          }
          if (!f.command.trim()) errors.command = "Enter a command.";
          if (f.size === "custom") {
            const cols = Number(f.cols);
            const rows = Number(f.rows);
            if (!Number.isInteger(cols) || !Number.isInteger(rows) || cols < 20 || cols > 500 || rows < 5 || rows > 200)
              errors.size = "Columns 20–500, rows 5–200.";
          }
          o.errors = errors;
          const first = ["name", "command", "size"].find((k) => errors[k]);
          if (first) {
            refreshOverlay();
            focusByKey(first === "size" ? `radio:size:${f.size}` : `field:form.${first}`);
            return;
          }
          // The daemon refuses a program it cannot find; the dialog stays open on the command.
          const word = f.command.trim().split(/\s+/)[0];
          if (!ON_PATH.includes(word)) {
            refreshOverlay();
            toast("error", `command not found: ${word}`);
            focusByKey("field:form.command");
            return;
          }
          const tab = openProgram(f);
          UI.overlays = [];
          renderOverlays();
          UI.panelTab = "activity";
          navigate(`/s/${tab.session}/${tab.id}`);
          // The first frame arrives once the program has drawn (agent-terminal waits for a stable screen).
          later(900, () => {
            tab.stream = "live";
            tab.frame = 1;
            render();
            announce(`${tabName(tab)} is live`);
          });
        },
        layout: (el) => {
          const n = Number(el.dataset.id);
          const split = currentSplit();
          if (split) {
            const focused = split[UI.splitFocus] ?? split.find(Boolean);
            if (n === 1) return navigate(focused ? `/s/${focused}` : "/");
            const cells = [...split.slice(0, n), ...Array(Math.max(0, n - split.length)).fill(null)];
            if (UI.splitFocus >= n) UI.splitFocus = 0;
            return navigate(splitRoute(cells));
          }
          const tab = shownTab();
          if (n === 1 || !tab) return;
          // Decision: from one tab, the split starts with it and fills the other cells with the open tabs that follow it.
          const others = allTabs()
            .filter((other) => other !== tab)
            .map(tabKey);
          const cells = [tabKey(tab), ...others].slice(0, n);
          while (cells.length < n) cells.push(null);
          UI.splitFocus = 0;
          navigate(splitRoute(cells));
        },
        "split-focus": (el) => {
          const i = Number(el.dataset.id);
          if (UI.splitFocus === i) return;
          UI.splitFocus = i;
          render();
        },
        "split-remove": (el) => {
          const cells = currentSplit();
          cells[Number(el.dataset.id)] = null;
          navigate(splitRoute(cells));
        },
        "split-pick": (el) => {
          const cells = currentSplit();
          const i = Number(el.dataset.id);
          cells[i] = el.dataset.tab;
          UI.splitFocus = i;
          UI.pendingFocus = `cell:${i}`;
          navigate(splitRoute(cells));
        },
        // In a split, a tab picked in the sidebar replaces the focused cell.
        "sidebar-tab": (el) => {
          const cells = currentSplit();
          if (!cells) return navigate(`/s/${el.dataset.id}`);
          cells[UI.splitFocus] = el.dataset.id;
          navigate(splitRoute(cells));
        },
        restart: (el) => {
          const tab = findTab(el.dataset.id);
          if (tab.status === "running") return openOverlay({ type: "restart", tab: tabKey(tab) });
          restartTab(tab);
          UI.pendingFocus = `take-control:${tabKey(tab)}`;
          render();
          announce(`${tab.program} restarted`);
        },
        "restart-confirm": (el) => {
          const tab = findTab(el.dataset.id);
          restartTab(tab);
          closeOverlay();
          render();
          announce(`${tab.program} restarted`);
        },
        "close-tab": (el) => {
          const tab = findTab(el.dataset.id);
          const next = closeTab(tab);
          navigate(next);
          announce(`Closed ${tabName(tab)}`);
        },
        screenshot: (el) => {
          const tab = findTab(el.dataset.id);
          const file = takeScreenshot(tab);
          render();
          toast("success", `Saved ${file}`, `${SHOT_DIR}/${file}`);
        },
        record: (el) => {
          const tab = findTab(el.dataset.id);
          const r = toggleRecord(tab);
          render();
          toast("success", r.on ? "Recording" : "Recording saved", r.path);
        },
        "take-control": (el) => {
          const tab = findTab(el.dataset.id);
          const key = tabKey(tab);
          if (tab.control === "human") {
            const retry = releaseControl(tab);
            render();
            announce("Control returned to the agent");
            if (retry)
              later(700, () => {
                agentRetries(tab);
                tab.agentNext = null;
                render();
              });
            return;
          }
          takeControl(tab);
          UI.pendingFocus = `terminal:${key}`;
          render();
          announce(`You have control of ${tabName(tab)}`);
          // The agent's next input call, made while the human holds the keyboard.
          if (tab.agentNext && !tab.activity.some((row) => row.res?.kind === "refused"))
            later(1800, () => {
              if (tab.control !== "human") return;
              agentRefused(tab);
              render();
              agentWaitingToast(tab);
            });
        },
        "panel-tab": (el) => {
          UI.panelTab = el.dataset.id;
          render();
        },
        "activity-row": (el) => {
          const tab = findTab(el.dataset.tab);
          const key = tabKey(tab);
          const row = activityById(tab, el.dataset.id);
          // Decision: a click both opens the row and shows its frame; it also stops following, so the row stays put.
          UI.follow = false;
          if (UI.expanded[key] === row.id) delete UI.expanded[key];
          else {
            UI.expanded[key] = row.id;
            setView(tab, row.frame);
          }
          render();
        },
        "command-row": (el) => {
          const tab = findTab(el.dataset.tab);
          const key = tabKey(tab);
          const c = tab.commands.find((x) => x.id === el.dataset.id);
          if (UI.cmdOpen[key] === c.id) delete UI.cmdOpen[key];
          else {
            UI.cmdOpen[key] = c.id;
            setView(tab, c.startFrame);
          }
          render();
        },
        follow: () => {
          UI.follow = !UI.follow;
          render();
        },
        "jump-latest": () => {
          UI.follow = true;
          UI.pendingFocus = "follow";
          render();
        },
        "clear-activity": (el) => {
          const tab = findTab(el.dataset.id);
          tab.cleared = tab.activity.length;
          delete UI.expanded[tabKey(tab)];
          render();
          announce("Activity cleared");
        },
        "go-live": (el) => {
          const tab = findTab(el.dataset.id);
          if (isLive(tab)) return;
          delete UI.view[tabKey(tab)];
          render();
          announce("Live");
        },
        scrub: (range) => {
          const tab = findTab(range.dataset.tab);
          setView(tab, Number(range.value));
          refreshTerminal(tab);
        },
        "toggle-raw": () => {
          UI.outputRaw = !UI.outputRaw;
          render();
        },
        "open-shot": (el) => openShot(el.dataset.session, el.dataset.id),
        "shot-prev": () => {
          topOverlay().index -= 1;
          refreshOverlay();
          focusByKey("shot-prev");
        },
        "shot-next": () => {
          topOverlay().index += 1;
          refreshOverlay();
          if (!document.activeElement?.dataset.fk) focusByKey("shot-prev");
        },
        "shot-pick": () => {
          topOverlay().picking = true;
          refreshOverlay();
          focusByKey("shot-compare");
        },
        "shot-compare": (el) => {
          if (el.value === "") return;
          const o = topOverlay();
          o.compare = Number(el.value);
          o.picking = false;
          refreshOverlay();
          focusByKey("shot-back");
        },
        "shot-back": () => {
          const o = topOverlay();
          o.compare = null;
          refreshOverlay();
          focusByKey("shot-pick");
        },
        "resize-by": (handle, delta) => {
          const side = handle.dataset.resize;
          setPct(side, (side === "left" ? UI.leftPct : UI.rightPct) + (side === "left" ? delta : -delta));
          render();
        },
      });

      /** The hint that tells the human the agent is waiting on them. */
      /** Decision: the hint is a warning toast that names the refused call and that the agent now waits; the Activity rows stay as the record. */
      const agentWaitingToast = (tab) => toast("warning", "The agent is waiting for control", `${tab.agentNext.cmd} refused · exit 4 · now: wait --control`);

      /* ---------- keys for a terminal a human controls (capture phase: before anything else sees them) ---------- */

      document.addEventListener(
        "keydown",
        (event) => {
          const el = event.target.closest?.("[data-terminal-input]");
          if (!el || event.metaKey) return;
          // Decision: every key goes to the program, Tab and Escape included; ctrl+p ctrl+q (attach's detach keys) moves focus out.
          if (event.ctrlKey && event.key.toLowerCase() === "p") {
            UI.keyChord = true;
            event.preventDefault();
            return;
          }
          if (UI.keyChord && event.ctrlKey && event.key.toLowerCase() === "q") {
            UI.keyChord = false;
            event.preventDefault();
            focusByKey(`take-control:${el.dataset.tab}`);
            return;
          }
          UI.keyChord = false;
          if (["Shift", "Control", "Alt", "Meta", "CapsLock"].includes(event.key)) return;
          const tab = findTab(el.dataset.tab);
          event.preventDefault();
          event.stopPropagation();
          if (tab?.control === "human" && isLive(tab) && humanKey(tab, event)) render();
        },
        true,
      );

      /* ---------- Activity follows the newest call until the human scrolls up ---------- */

      document.addEventListener(
        "scroll",
        (event) => {
          const el = event.target;
          if (!(el instanceof HTMLElement) || el.dataset.followLog === undefined) return;
          const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
          if (atBottom === UI.follow) return;
          UI.follow = atBottom;
          el.dataset.follow = String(atBottom);
          const jump = document.getElementById("jump-latest");
          if (jump) jump.hidden = atBottom;
          document.querySelector('[data-fk="follow"]')?.setAttribute("aria-pressed", String(atBottom));
        },
        true,
      );

      /* ---------- the resizable handles: drag with the pointer ---------- */

      document.addEventListener("pointerdown", (event) => {
        const handle = event.target.closest?.("[data-resize]");
        if (!handle) return;
        event.preventDefault();
        handle.setPointerCapture(event.pointerId);
        const side = handle.dataset.resize;
        const box = handle.closest(".shell-cols").getBoundingClientRect();
        const col = handle.closest(".shell-cols").querySelector(side === "left" ? ".col-left" : ".col-right");
        const move = (e) => {
          const pct = side === "left" ? ((e.clientX - box.left) / box.width) * 100 : ((box.right - e.clientX) / box.width) * 100;
          col.style.width = `${setPct(side, pct)}%`;
        };
        const up = () => {
          handle.removeEventListener("pointermove", move);
          render();
        };
        handle.addEventListener("pointermove", move);
        handle.addEventListener("pointerup", up, { once: true });
      });

      /* ============================================================================
       * Routes: each hash path and the screen it renders. "/" goes to the first open tab, or shows the empty states.
       * ========================================================================== */

      const routeRedirect = (route) => {
        if (route !== "/" || S.daemon !== "up" || !S.sessions.length) return null;
        const first = allTabs()[0];
        return `/s/${first.session}/${first.id}`;
      };
      const ROUTES = [
        [/^\/$/, () => (S.daemon === "down" ? screenDaemonDown() : screenEmpty())],
        [/^\/s\/([^/]+)\/([^/]+)$/, ([, session, id]) => screenTab(decodeURIComponent(session), decodeURIComponent(id))],
        [/^\/split\/([^/]+)$/, ([, spec]) => screenSplit(decodeURIComponent(spec))],
      ];

      /* ============================================================================
       * Scenarios: one mode, twenty steps, walking through the dashboard as the owner will watch an agent QA a TUI. Each step
       * rebuilds its own state from the baseline; the writers a step calls are the ones the controls call.
       * ========================================================================== */

      /** Presses a control the way a person would: focus first, so what it opens knows where to hand focus back. */
      const pressControl = (fk) => {
        const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
        if (!el) return;
        el.focus({ preventScroll: true });
        el.click();
      };
      const chatExited = () => {
        const chat = findTab("chat/t1");
        chat.activity.push(
          { id: "chat/t1#6", t: at("14:02:10.004"), cmd: 'type "and the failing checks?"', ms: 212, frame: 101 },
          {
            id: "chat/t1#7",
            t: at("14:02:10.300"),
            cmd: "press Enter --wait-stable",
            ms: 1204,
            frame: 109,
            res: { kind: "exited" },
            out: "The terminal's process exited with code 1 (exit 5). Last rows:\n17│error   connection refused: http://localhost:8787/v1/chat",
          },
        );
        Object.assign(chat, { status: "exited", exitCode: 1, chatError: 109, frame: 109 });
      };

      const STEPS = [
        {
          title: "No sessions yet",
          description:
            "The dashboard before any agent has opened a terminal: the center gives the three commands that start one, each with a copy button, and the New session button agent-browser has. The side panel stays hidden until there is a tab to describe.",
          route: "/",
          before: () => (S.sessions = []),
        },
        {
          title: "Daemon not running",
          description:
            "The page is open but the daemon behind it is gone: the sidebar says Not connected and the center gives the one command that starts it. Retry reconnects; here it finds the four sessions and opens qa t1.",
          route: "/",
          before: () => (S.daemon = "down"),
        },
        {
          title: "New session: the CLI line, and a name already taken",
          description:
            "The form writes the equivalent agent-terminal line under itself as you type, with a copy button, so a human learns the CLI from the UI. Create with the name qa is refused on the field because qa is open; a command such as lazyget gets the command-not-found toast.",
          route: "/s/qa/t1",
          open: () => {
            pressControl("new-session");
            Object.assign(topOverlay().form, { name: "qa", command: "lazygit", cwd: CWD_AT, size: "120x40" });
            refreshOverlay();
            pressDialogSubmit();
          },
        },
        {
          title: "qa / lazygit, live",
          description:
            "An agent is mid-run: it opened lazygit on this repo, staged docs/design.md and is typing the commit message (the cursor is in lazygit's input); the red dot says it records a cast. Activity follows the newest call at the bottom, as agent-browser's log does.",
          route: "/s/qa/t1",
          before: () => playUntil("qa/t1", 10),
        },
        {
          title: "snapshot -i: what the agent read",
          description:
            "Clicking a row opens what the CLI printed, here the screen as text with its refs, and puts the terminal back at that call's frame. The status bar says which frame is shown and the Live button returns.",
          route: "/s/qa/t1",
          before: () => {
            playUntil("qa/t1", 4);
            UI.expanded["qa/t1"] = "qa/t1#2";
            UI.follow = false;
            setView(findTab("qa/t1"), 6);
          },
        },
        {
          title: "A wait that timed out",
          description:
            'The agent pressed P and waited five seconds for "Pushed"; the push stopped at a GitHub username prompt instead. The row is red with timeout, and opening it shows the rows the agent saw.',
          route: "/s/qa/t1",
          before: () => {
            playUntil("qa/t1", 18);
            UI.expanded["qa/t1"] = "qa/t1#16";
          },
        },
        {
          title: "Screenshots of the session",
          description:
            "Every screenshot of session qa with the call that took it; the agent's last one, qa-t1-212.png, is the newest. Open one for the lightbox; the camera in the toolbar adds one taken from the dashboard.",
          route: "/s/qa/t1",
          before: () => (UI.panelTab = "screenshots"),
        },
        {
          title: "Compare two screenshots",
          description:
            "Compare with… puts two screenshots side by side and marks every cell that changed, with the count above: between frames 19 and 212 the commit was made, the branch went one ahead and another file is shown. Back to screenshot leaves the comparison.",
          route: "/s/qa/t1",
          before: () => (UI.panelTab = "screenshots"),
          open: () => {
            const o = openShot("qa", "qa-t1-212.png");
            o.compare = screenshotsOf("qa").findIndex((s) => s.file === "qa-t1-19.png");
            refreshOverlay();
            focusByKey("shot-back");
          },
        },
        {
          title: "build / zsh: the failing cargo test",
          description:
            "Commands is the shell's history from its OSC 133 marks: exit status, command, cwd, duration and time. The failing cargo test is open on its output, and the terminal is back at the moment it started.",
          route: "/s/build/t1",
          before: () => {
            UI.panelTab = "commands";
            UI.cmdOpen["build/t1"] = "c2";
            setView(findTab("build/t1"), 170);
          },
        },
        {
          title: "A shell without integration",
          description:
            "qa t2 was opened as a plain zsh (tab new zsh) to run the monorepo's dev server, so it has no command marks: Commands says so and gives the line that opens a shell with them. lazygit's tab says instead that Commands come from shells.",
          route: "/s/qa/t2",
          before: () => (UI.panelTab = "commands"),
        },
        {
          title: "Scrubbed back to frame 148",
          description:
            "The timeline under the terminal spans the tab's life, with a tick per call, command and screenshot; dragging it shows any frame. Away from live, the dot turns grey, the status bar names the frame and its time, and keys are not sent.",
          route: "/s/qa/t1",
          before: () => setView(findTab("qa/t1"), 148),
          open: () => focusByKey("scrub:qa/t1"),
        },
        {
          title: "Take control: the agent is refused",
          description:
            "Take control gives the human the keyboard: an amber ring, the terminal focused, the sidebar says human, and keys go to lazygit (try j and k). The agent's press j meanwhile is refused with exit 4 and it waits; the toast tells the human so.",
          route: "/s/qa/t1",
          before: () => {
            const tab = findTab("qa/t1");
            takeControl(tab);
            agentRefused(tab);
          },
          open: () => {
            agentWaitingToast(findTab("qa/t1"));
            focusByKey("terminal:qa/t1");
          },
        },
        {
          title: "Release: the agent resumes",
          description:
            "Release control hands the keyboard back. Activity shows the agent's wait --control resolving after 41.8 s and its press j going through; the ring and the human chip are gone.",
          route: "/s/qa/t1",
          before: () => {
            const tab = findTab("qa/t1");
            takeControl(tab);
            agentRefused(tab);
            clockTicks += 37;
            releaseControl(tab);
            agentRetries(tab);
            tab.agentNext = null;
          },
          open: () => focusByKey("take-control:qa/t1"),
        },
        {
          title: "Split view, 2-up",
          description:
            "The layout switch puts two terminals side by side: the lazygit under test and the dev server it talks to. The focused cell (ringed) is the one the toolbar, status bar and side panel describe; click the other to switch.",
          route: "/split/qa:t1,qa:t2",
        },
        {
          title: "Split view, 4-up",
          description:
            "Four terminals from three sessions: lazygit, the dev server, cargo test and the chat TUI. Each cell's header names session, tab and program, with maximize and remove.",
          route: "/split/qa:t1,qa:t2,build:t1,chat:t1",
        },
        {
          title: "Pick a terminal for an empty cell",
          description:
            "A removed cell lists every open tab, by session, to show in its place; tabs already in the grid are disabled. Picking one fills the cell and focuses it.",
          route: "/split/qa:t1,qa:t2,build:t1,_",
          open: () => focusByKey("pick:3:chat/t1"),
        },
        {
          title: "repost chat exited 1",
          description:
            "The chat TUI exited with code 1 when its API went away: the last frame stays, dimmed, with the error on it, and the bar offers Restart and Close tab. The agent's pending press Enter came back exit 5, process exited.",
          route: "/s/chat/t1",
          before: chatExited,
          open: () => focusByKey("exit-restart:chat/t1"),
        },
        {
          title: "Stream reconnecting",
          description:
            "The dashboard lost the tab's stream for a moment: the dot turns amber, Reconnecting… replaces Live, the last frame stays dimmed and Take control waits. The agent's calls are not affected; they go over the daemon's socket.",
          route: "/s/qa/t1",
          before: () => (findTab("qa/t1").stream = "reconnecting"),
        },
        {
          title: "Close all sessions",
          description:
            "The trash icon in the sidebar header asks first, naming how many sessions close and how many running processes are killed. Close all empties the dashboard.",
          route: "/s/qa/t1",
          open: () => pressControl("close-all"),
        },
        {
          title: "Light theme",
          description:
            "The sun icon switches to agent-browser's light theme; the terminal keeps the program's own dark palette, as a screenshot would. The moon switches back.",
          route: "/s/qa/t1",
          theme: "light",
        },
      ];

      /* ---------- boot ---------- */

      const boot = () => {
        BASE = buildBaseline();
        resetUiState();
        resetWorld();
        UI.panelOpen = window.innerWidth >= 1100;
        applyTheme();
        if (!location.hash) history.replaceState(null, "", `#${HOME}`);
        render();
      };
      boot();
    </script>
  </body>
</html>
