<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.469.0/font/lucide.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!--
      Theme tokens copied from the agent-browser dashboard's stylesheet (the CSS chunk served on :4848, light :root and .dark),
      which this dashboard is the sibling of. Icons: lucide, the app's icon set, as its webfont.
    -->
    <style type="text/tailwindcss">
      @custom-variant dark (&:is(.dark *));

      @theme inline {
        --font-sans: "Geist", "Geist Fallback", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --font-heading: "Geist", "Geist Fallback", ui-sans-serif, system-ui, sans-serif;
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-sidebar: var(--sidebar);
        --color-sidebar-foreground: var(--sidebar-foreground);
        --color-sidebar-accent: var(--sidebar-accent);
        --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
        --color-sidebar-border: var(--sidebar-border);
        --color-sidebar-ring: var(--sidebar-ring);
        --color-success: var(--success);
        --color-warning: var(--warning);
        --radius-sm: calc(var(--radius) * 0.6);
        --radius-md: calc(var(--radius) * 0.8);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) * 1.4);
        --radius-4xl: calc(var(--radius) * 2.6);
      }

      :root {
        --background: #fff;
        --foreground: #0a0a0a;
        --card: #fff;
        --card-foreground: #0a0a0a;
        --popover: #fff;
        --popover-foreground: #0a0a0a;
        --primary: #171717;
        --primary-foreground: #fafafa;
        --secondary: #f5f5f5;
        --secondary-foreground: #171717;
        --muted: #f5f5f5;
        --muted-foreground: #737373;
        --accent: #f5f5f5;
        --accent-foreground: #171717;
        --destructive: #e40014;
        --border: #e5e5e5;
        --input: #e5e5e5;
        --ring: #a1a1a1;
        --radius: 0.625rem;
        --sidebar: #fafafa;
        --sidebar-foreground: #0a0a0a;
        --sidebar-primary: #171717;
        --sidebar-primary-foreground: #fafafa;
        --sidebar-accent: #f5f5f5;
        --sidebar-accent-foreground: #171717;
        --sidebar-border: #e5e5e5;
        --sidebar-ring: #a1a1a1;
        --success: #22c55e;
        --warning: #eab308;
        /* Prototype chrome only: the docked Scenarios panel. */
        --panel-w: 23rem;
      }

      .dark {
        --background: #0a0a0a;
        --foreground: #e5e5e5;
        --card: #141414;
        --card-foreground: #e5e5e5;
        --popover: #141414;
        --popover-foreground: #e5e5e5;
        --primary: #e5e5e5;
        --primary-foreground: #171717;
        --secondary: #1a1a1a;
        --secondary-foreground: #e5e5e5;
        --muted: #1a1a1a;
        --muted-foreground: #737373;
        --accent: #1a1a1a;
        --accent-foreground: #e5e5e5;
        --destructive: #ef4444;
        --border: #ffffff1a;
        --input: #ffffff26;
        --ring: #737373;
        --sidebar: #141414;
        --sidebar-foreground: #e5e5e5;
        --sidebar-primary: #1447e6;
        --sidebar-primary-foreground: #fafafa;
        --sidebar-accent: #1a1a1a;
        --sidebar-accent-foreground: #e5e5e5;
        --sidebar-border: #ffffff1a;
        --sidebar-ring: #737373;
        --success: #22c55e;
        --warning: #eab308;
      }

      html[data-panel="closed"] {
        --panel-w: 0rem;
      }
      /* Under 900px the open Scenarios panel lays over the app instead of narrowing it. */
      @media (max-width: 899px) {
        html[data-panel="open"] {
          --panel-w: 0rem;
        }
      }

      @layer base {
        * {
          @apply border-border outline-ring/50;
        }
        body {
          @apply bg-background text-foreground;
        }
        button:not(:disabled),
        [role="button"]:not([aria-disabled="true"]),
        a[href],
        summary {
          cursor: pointer;
        }
      }
    </style>
    <style>
      /* JetBrains Mono, whole (Google Fonts' subsets leave out box drawing): the font the daemon renders PNGs with. */
      @font-face {
        font-family: "JetBrains Mono Term";
        src: url("https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@v2.304/fonts/webfonts/JetBrainsMono-Regular.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "JetBrains Mono Term";
        src: url("https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@v2.304/fonts/webfonts/JetBrainsMono-Bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      [class^="icon-"],
      [class*=" icon-"] {
        line-height: 1;
        display: inline-block;
        flex-shrink: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          animation: none !important;
        }
      }

      /* ---------- the app's three columns; under 900px of app width they stack (container query, the panel narrows the app) ---------- */
      .shell {
        container-type: inline-size;
        container-name: shell;
      }
      @container shell (max-width: 899px) {
        .shell-cols {
          flex-direction: column;
          overflow-y: auto;
        }
        .shell-cols > .col-left,
        .shell-cols > .col-right {
          width: auto !important;
          min-width: 0 !important;
          max-width: none !important;
        }
        .shell-cols > .col-left {
          max-height: 16rem;
          border-bottom: 1px solid var(--border);
        }
        .shell-cols > .col-center {
          min-height: 32rem;
          flex: none;
        }
        .shell-cols > .col-right {
          min-height: 28rem;
          flex: none;
          border-top: 1px solid var(--border);
        }
        .shell-cols > [role="separator"] {
          display: none;
        }
        .split-grid {
          grid-template-columns: 1fr !important;
          grid-auto-rows: minmax(14rem, 1fr) !important;
        }
      }

      /*
       * ---------- the terminal grid: the daemon's cells as spans, in the font the server renders PNGs with ----------
       * One cell is 0.6em wide (JetBrains Mono's advance) and 1.2em high. The font size fits the grid inside its box, the way
       * agent-browser fits its canvas (max-w-full max-h-full object-contain): never larger than 13px, never clipped.
       */
      .term-box {
        container-type: size;
      }
      /* Decision: the grid uses JetBrains Mono, the font the daemon renders PNGs with (docs/design.md), so the live view and a
       * screenshot match cell for cell; and keeps the program's dark palette under both dashboard themes. */
      .term {
        --cols: 120;
        --rows: 36;
        --fit: min(13px, calc((100cqw - 2rem) / (var(--cols) * 0.6)), calc((100cqh - 2rem) / (var(--rows) * 1.2)));
        font-family: "JetBrains Mono Term", ui-monospace, monospace;
        font-size: var(--fit);
        line-height: 1.2;
        white-space: pre;
        margin: 0;
        overflow: hidden;
        width: calc(var(--cols) * 0.6em);
        height: calc(var(--rows) * 1.2em);
        background: var(--t-bg);
        color: var(--t-fg);
        font-variant-ligatures: none;
        box-shadow: 0 0 0 1px rgb(255 255 255 / 0.08);
      }
      .term-thumb {
        --fit: calc(100cqw / (var(--cols) * 0.6));
      }
      .term span {
        display: inline;
      }
      .term.is-dim {
        opacity: 0.45;
      }
      /* Terminal palette: the program's own theme (dark), the same under the dashboard's light and dark themes. */
      :root {
        --t-bg: #111113;
        --t-fg: #d4d4d8;
        --t0: #27272a;
        --t1: #f87171;
        --t2: #4ade80;
        --t3: #facc15;
        --t4: #60a5fa;
        --t5: #c084fc;
        --t6: #22d3ee;
        --t7: #d4d4d8;
        --t8: #71717a;
        --t9: #fca5a5;
        --t10: #86efac;
        --t11: #fde047;
        --t12: #93c5fd;
        --t13: #d8b4fe;
        --t14: #67e8f9;
        --t15: #fafafa;
        --t-sel: #1e3a8a;
      }
      .tf0 {
        color: var(--t0);
      }
      .tf1 {
        color: var(--t1);
      }
      .tf2 {
        color: var(--t2);
      }
      .tf3 {
        color: var(--t3);
      }
      .tf4 {
        color: var(--t4);
      }
      .tf5 {
        color: var(--t5);
      }
      .tf6 {
        color: var(--t6);
      }
      .tf7 {
        color: var(--t7);
      }
      .tf8 {
        color: var(--t8);
      }
      .tf15 {
        color: var(--t15);
      }
      .tfbg {
        color: var(--t-bg);
      }
      .tb0 {
        background: var(--t0);
      }
      .tb1 {
        background: var(--t1);
      }
      .tb2 {
        background: var(--t2);
      }
      .tb3 {
        background: var(--t3);
      }
      .tb4 {
        background: var(--t-sel);
      }
      .tb6 {
        background: var(--t6);
      }
      .tb8 {
        background: #3f3f46;
      }
      .tbfg {
        background: var(--t-fg);
      }
      .tB {
        font-weight: 700;
      }
      .tD {
        opacity: 0.6;
      }
      .tU {
        text-decoration: underline;
      }
      .tcur {
        background: var(--t-fg);
        color: var(--t-bg);
      }
      @media (prefers-reduced-motion: no-preference) {
        .term-live .tcur {
          animation: cursor-blink 1.1s steps(1) infinite;
        }
      }
      @keyframes cursor-blink {
        50% {
          background: transparent;
          color: inherit;
        }
      }
      /* Compare: a changed cell. Not colour alone: the count of changed cells is printed beside the pair. */
      .tdiff {
        background: rgb(245 158 11 / 0.35);
        box-shadow: inset 0 -2px 0 #f59e0b;
      }

      /* The timeline scrubber: a native range, thin. */
      .scrub {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        height: 24px;
        width: 100%;
        margin: 0;
      }
      .scrub::-webkit-slider-runnable-track {
        height: 2px;
        background: var(--border);
      }
      .scrub::-moz-range-track {
        height: 2px;
        background: var(--border);
      }
      .scrub::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        margin-top: -4px;
        border-radius: 9999px;
        background: var(--foreground);
        border: 0;
      }
      .scrub::-moz-range-thumb {
        width: 10px;
        height: 10px;
        border-radius: 9999px;
        background: var(--foreground);
        border: 0;
      }
      .scrub:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      /*
       * Toasts. Not in the app: the agent-browser dashboard has no toaster (it shows errors inside its dialogs); the brief asks
       * for toasts, so they take the dialog's error recipe (bg-destructive/10 text-destructive) and the popover surface.
       */
      .toaster {
        position: fixed;
        top: 3rem;
        left: calc((100vw - var(--panel-w)) / 2);
        transform: translateX(-50%);
        width: 360px;
        max-width: calc(100vw - 2rem);
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        border-radius: calc(var(--radius) * 1.4);
        background: var(--popover);
        color: var(--popover-foreground);
        box-shadow:
          0 0 0 1px color-mix(in oklab, var(--foreground) 10%, transparent),
          0 8px 24px rgb(0 0 0 / 0.25);
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .toast[data-type="error"] {
        color: var(--destructive);
        background: color-mix(in oklab, var(--destructive) 12%, var(--popover));
      }
      .toast[data-type="warning"] {
        background: color-mix(in oklab, var(--warning) 12%, var(--popover));
      }
      @media (prefers-reduced-motion: no-preference) {
        .toast {
          animation: toast-in 160ms ease-out both;
        }
        [data-overlay-content]:not([data-shown]) {
          animation: overlay-in 100ms ease-out both;
        }
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes overlay-in {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .ansi-g {
        color: #16a34a;
      }
      .ansi-r {
        color: #dc2626;
      }
      .ansi-y {
        color: #ca8a04;
      }
      .ansi-c {
        color: #0891b2;
      }
      .ansi-m {
        color: #9333ea;
      }
      .dark .ansi-g {
        color: #4ade80;
      }
      .dark .ansi-r {
        color: #f87171;
      }
      .dark .ansi-y {
        color: #facc15;
      }
      .dark .ansi-c {
        color: #22d3ee;
      }
      .dark .ansi-m {
        color: #c084fc;
      }
      .ansi-b {
        font-weight: 700;
      }
      .ansi-d {
        opacity: 0.6;
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased">
    <a
      href="#main-content"
      data-action="skip-to-content"
      class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[200] focus:rounded-md focus:bg-background focus:px-3 focus:py-2 focus:text-sm focus:shadow-md"
      >Skip to content</a
    >
    <div id="app"></div>
    <div id="panel-root"></div>
    <div id="overlay-root"></div>
    <section class="toaster" aria-label="Notifications" aria-live="polite" aria-relevant="additions" id="toaster"></section>
    <div id="route-announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
    <div id="polite-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script>
      "use strict";

      /* ============================================================================
       * Prototype of docs/design.md, section "Dashboard": the agent-terminal dashboard (`agent-terminal dashboard start`,
       * http://localhost:4849). It is the agent-browser dashboard's sibling: the same three resizable columns (sessions,
       * the live screen, a tabbed side panel), the same tokens, density and recipes, copied from the running agent-browser
       * dashboard on :4848. This file is the project's first prototype: it opens with its kit (utilities, primitives, the
       * shell, the runtime with the scenario runner) and goes on to the feature (data, derivations, screens, routes, steps),
       * so the next prototype can start from a copy of it. The mechanics are ported from the firewall prototype of another
       * app; nothing of its look, names or data is here.
       * ========================================================================== */

      /* ---------- utilities: escaping, the fixed clock, times in the viewer's own time zone ---------- */

      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      const cn = (...parts) => parts.filter(Boolean).join(" ");
      const clone = (value) => structuredClone(value);
      /** A lucide icon (the app's icon set) from its webfont. Decorative: the control carries the name. */
      const icon = (name, cls = "text-[16px]") => `<i class="icon-${name} ${cls}" aria-hidden="true"></i>`;

      /*
       * The prototype clock is fixed at 14 Oct 2026, 14:02:30 UTC, a few seconds after the agent's QA run of lazygit ended.
       * A write is stamped 1.1 s after the previous one, so rows keep their order; a step or Reset starts it again.
       */
      const PROTOTYPE_NOW = Date.parse("2026-10-14T14:02:30.000Z");
      let clockTicks = 0;
      const stamp = () => {
        clockTicks += 1;
        return new Date(PROTOTYPE_NOW + clockTicks * 1100).toISOString();
      };
      const p2 = (n) => String(n).padStart(2, "0");
      const asDate = (value) => (value instanceof Date ? value : new Date(value));
      /** "14:02:07.312": an Activity row's time, to the millisecond, in the viewer's zone. */
      const fmtMs = (value) => {
        const d = asDate(value);
        return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, "0")}`;
      };
      /** "14:01:52": a time to the second. */
      const fmtSec = (value) => {
        const d = asDate(value);
        return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
      };
      const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      /** "Oct 14, 2026 14:02": the Scenarios panel's clock line and Info's "started". */
      const fmtDateTime = (value) => {
        const d = asDate(value);
        return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
      };
      const timeEl = (value, text) => `<time datetime="${asDate(value).toISOString()}" class="tabular-nums">${esc(text)}</time>`;
      /**
       * Decision: durations as the CLI prints them, "38 ms" under a second, "41.2 s" from one second, "1 min 04 s" from a minute.
       * Not agent-browser's "12ms": the brief writes them with a space.
       */
      const fmtDuration = (ms) => {
        if (ms < 1000) return `${Math.round(ms)} ms`;
        if (ms < 60000) return `${(ms / 1000).toFixed(1)} s`;
        return `${Math.floor(ms / 60000)} min ${p2(Math.round((ms % 60000) / 1000))} s`;
      };
      /** Overlay and toast keys: a counter, never the machine's clock. */
      let idSeq = 0;
      const newId = (prefix) => `${prefix}_${(idSeq++).toString(36)}`;
      /** "~/github.com/repost-sh/agent-terminal" → "~/g/r/agent-terminal": a cwd shortened the way fish and starship do. */
      const shortPath = (path) => {
        const parts = path.split("/");
        return parts.map((part, i) => (i === 0 || i === parts.length - 1 || !part ? part : part[0])).join("/");
      };

      /* ============================================================================
       * UI primitives: the agent-browser dashboard's class recipes (shadcn/ui on Tailwind v4, as served on :4848).
       * Lucide's webfont replaces its inline SVG, so `[&_svg]` becomes `[&_i]`.
       * ========================================================================== */

      /** Click and change handlers, keyed by data-action. */
      const ACTIONS = {};
      const fkOf = (action, id) => `${action}${id ? `:${id}` : ""}`;
      const attrs = (map = {}) =>
        Object.entries(map)
          .filter(([, v]) => v !== undefined && v !== null && v !== false)
          .map(([k, v]) => (v === true ? k : `${k}="${esc(v)}"`))
          .join(" ");

      /* ---------- button (components/ui/button.tsx, the dashboard's dialogs and empty state) ---------- */

      const BTN_BASE =
        "group/button inline-flex shrink-0 items-center justify-center border border-transparent bg-clip-padding font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_i]:pointer-events-none [&_i]:shrink-0";
      const BTN_VARIANT = {
        default: "bg-primary text-primary-foreground hover:bg-primary/80",
        ghost: "hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:hover:bg-muted/50",
        outline: "border-border bg-background hover:bg-muted hover:text-foreground dark:bg-input/30 dark:border-input dark:hover:bg-input/50",
        secondary: "bg-secondary text-secondary-foreground hover:bg-secondary/80",
        destructive:
          "bg-destructive/10 text-destructive hover:bg-destructive/20 focus-visible:border-destructive/40 focus-visible:ring-destructive/20 dark:bg-destructive/20 dark:hover:bg-destructive/30 dark:focus-visible:ring-destructive/40",
      };
      const BTN_SIZE = {
        sm: "h-7 gap-1 rounded-[min(var(--radius-md),12px)] px-2.5 text-[0.8rem] [&_i]:text-[14px]",
        "icon-sm": "size-7 rounded-[min(var(--radius-md),12px)] text-sm [&_i]:text-[16px]",
        // Not a Button size: the prototype's own chrome (Scenarios panel).
        xs: "h-6 gap-1 rounded-md px-2 text-xs [&_i]:text-[13px]",
      };
      const btnClass = (variant = "default", size = "sm", extra = "") => cn(BTN_BASE, BTN_VARIANT[variant], BTN_SIZE[size], extra);

      /**
       * btn({ label, variant, size, action, id, icon, iconRight, disabled, type, ariaLabel, cls, data, iconOnly, tooltip })
       * Actions dispatch through data-action; data-fk lets focus come back after a re-render.
       */
      const btn = (o) => {
        const fk = o.fk ?? fkOf(o.action ?? "btn", o.id);
        const inner = `${o.icon ? icon(o.icon, o.iconCls ?? "") : ""}${o.iconOnly ? `<span class="sr-only">${esc(o.label)}</span>` : esc(o.label)}${
          o.iconRight ? icon(o.iconRight, "") : ""
        }`;
        return `<button ${attrs({
          type: o.type ?? "button",
          class: btnClass(o.variant, o.size, o.cls),
          "data-action": o.action,
          "data-id": o.id,
          "data-fk": fk,
          "aria-label": o.ariaLabel,
          "data-tooltip": o.tooltip,
          disabled: o.disabled,
          ...(o.data ?? {}),
        })}>${inner}</button>`;
      };

      /**
       * The dashboard's small icon buttons. Toolbar: `shrink-0 rounded p-1 text-muted-foreground …` around a size-4 icon (24px).
       * Sidebar header: `flex size-5 …`. Not in the app: size-6 here, not size-5, so each is 24px (WCAG 2.5.8).
       */
      const TOOL_BTN =
        "inline-flex min-h-6 min-w-6 shrink-0 items-center justify-center rounded p-1 text-muted-foreground transition-colors outline-none hover:bg-muted hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-40 aria-pressed:text-foreground";
      const HEAD_BTN =
        "flex size-6 items-center justify-center rounded text-muted-foreground outline-none hover:bg-muted hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-40";
      const iconBtn = (o) =>
        `<button ${attrs({
          type: "button",
          class: cn(o.head ? HEAD_BTN : TOOL_BTN, o.cls),
          "data-action": o.action,
          "data-id": o.id,
          "data-fk": o.fk ?? fkOf(o.action, o.id),
          "data-tooltip": o.tooltip ?? o.label,
          "data-tooltip-side": o.side,
          "aria-pressed": o.pressed === undefined ? undefined : String(o.pressed),
          disabled: o.disabled,
          ...(o.data ?? {}),
        })}>${o.inner ?? icon(o.icon, o.head ? "text-[13px]" : "text-[16px]")}<span class="sr-only">${esc(o.label)}</span></button>`;

      /* ---------- badge (components/ui/badge.tsx: rounded-4xl, h-4 px-1.5 text-[10px] where the dashboard uses it) ---------- */

      const BADGE_BASE =
        "inline-flex w-fit shrink-0 items-center justify-center gap-1 overflow-hidden rounded-4xl border py-0.5 font-medium whitespace-nowrap h-4 px-1.5 text-[10px] tabular-nums [&>i]:text-[10px]";
      const BADGE_VARIANT = {
        secondary: "border-transparent bg-secondary text-secondary-foreground",
        outline: "border-border text-foreground",
      };
      const badge = (label, variant = "secondary", extra = "") =>
        `<span data-slot="badge" class="${cn(BADGE_BASE, BADGE_VARIANT[variant], extra)}">${label}</span>`;

      /**
       * The tab row's chip (agent-browser's `active` chip: rounded border px-1 py-px text-[9px]). Tones are new: they repeat the
       * word, never replace it. Decision: `exited 1` (any non-zero code) takes the destructive tone, `human` the warning tone,
       * `exited 0` stays muted.
       */
      const CHIP_TONE = {
        muted: "border-border text-muted-foreground",
        destructive: "border-destructive/40 text-destructive",
        warning: "border-warning/50 text-yellow-700 dark:text-warning",
      };
      const chip = (label, tone = "muted") =>
        `<span class="${cn("shrink-0 rounded border px-1 py-px text-[9px] leading-none whitespace-nowrap", CHIP_TONE[tone])}">${esc(label)}</span>`;

      /** The status dot (status bar: size-2 rounded-full bg-success). Tones: success, warning, muted, destructive. */
      const DOT_TONE = { success: "bg-success", warning: "bg-warning", muted: "bg-muted-foreground/60", destructive: "bg-destructive" };
      const dot = (tone, extra = "") => `<span aria-hidden="true" class="${cn("inline-block size-2 shrink-0 rounded-full", DOT_TONE[tone], extra)}"></span>`;

      /* ---------- form controls (the New session dialog's input; labels and field messages as the dialog's error box) ---------- */

      const INPUT_CLS =
        "w-full rounded-md border border-border bg-transparent px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-ring placeholder:text-muted-foreground/60 aria-invalid:border-destructive aria-invalid:focus:ring-destructive/40";
      const LABEL_CLS = "text-xs font-medium text-muted-foreground";
      /** The dashboard's dialog error (rounded-md bg-destructive/10 px-3 py-2 text-xs text-destructive), placed under its field. */
      const fieldError = (id, text) =>
        text ? `<p id="${id}" class="rounded-md bg-destructive/10 px-3 py-2 text-xs text-destructive" role="alert">${text}</p>` : "";
      /** A labelled text field bound to the top dialog (data-bind="o:<path>"). */
      const textField = ({ id, label, path, value, placeholder = "", mono = false, error = "", autofocus = false, describedBy = "" }) => {
        const errId = `${id}-error`;
        return `<div class="grid gap-1.5"><label for="${id}" class="${LABEL_CLS}">${esc(label)}</label><input ${attrs({
          id,
          type: "text",
          class: cn(INPUT_CLS, mono && "font-mono text-[13px]"),
          value,
          placeholder,
          spellcheck: "false",
          autocomplete: "off",
          "data-bind": `o:${path}`,
          "data-rerender": true,
          "data-fk": `field:${path}`,
          "aria-invalid": error ? "true" : undefined,
          "aria-describedby": cn(error && errId, describedBy) || undefined,
          "data-autofocus": autofocus || undefined,
        })} />${fieldError(errId, error)}</div>`;
      };

      /* ---------- dialog (components/ui/dialog.tsx as the dashboard renders New session and Close all sessions) ---------- */

      /* Overlays cover the app area only (left of the Scenarios panel), so the panel stays usable while a dialog is open. */
      const DIALOG_OVERLAY_CLS = "fixed inset-y-0 left-0 isolate z-50 bg-black/10 supports-backdrop-filter:backdrop-blur-xs";
      const DIALOG_CLS =
        "fixed top-1/2 z-50 grid max-h-[calc(100dvh-2rem)] w-full -translate-x-1/2 -translate-y-1/2 gap-4 overflow-y-auto rounded-xl bg-popover p-4 text-sm text-popover-foreground ring-1 ring-foreground/10 outline-none";
      const APP_AREA = "right: var(--panel-w)";
      const appCenter = (rem) => `left: calc((100vw - var(--panel-w)) / 2); max-width: min(calc(100vw - var(--panel-w) - 2rem), ${rem}rem)`;
      const DIALOG_FOOTER = "-mx-4 -mb-4 flex flex-col-reverse gap-2 rounded-b-xl border-t bg-muted/50 p-4 sm:flex-row sm:justify-end";

      /**
       * dialogShell(o, { title, description, body, footer, width, submit, alert }). A form dialog wraps body and footer in its
       * <form>; submit names the action. alert: an AlertDialog (role alertdialog, no close X, the overlay does nothing).
       */
      const dialogShell = (o, { title, description = "", body = "", footer = "", width = 28, submit = null, alert = false, isTop }) => {
        const titleId = `${o.id}-title`;
        const descId = `${o.id}-desc`;
        const inner = `<div data-slot="dialog-header" class="flex flex-col gap-2 pr-8"><h2 id="${titleId}" data-slot="dialog-title" class="font-heading text-base leading-none font-medium [overflow-wrap:anywhere]">${title}</h2>${
          description ? `<p id="${descId}" class="text-sm text-muted-foreground">${description}</p>` : ""
        }</div>${body}${footer ? `<div data-slot="dialog-footer" class="${DIALOG_FOOTER}">${footer}</div>` : ""}`;
        const content = submit ? `<form id="${o.id}-form" data-submit="${submit}" class="grid gap-4" novalidate>${inner}</form>` : inner;
        return `<div data-overlay="${o.id}"><div data-slot="dialog-overlay" class="${DIALOG_OVERLAY_CLS}" style="${APP_AREA}" ${
          alert ? "" : 'data-action="overlay-dismiss"'
        }></div><div role="${alert ? "alertdialog" : "dialog"}" aria-modal="true" aria-labelledby="${titleId}" ${
          description ? `aria-describedby="${descId}"` : ""
        } data-overlay-content ${o.shown ? 'data-shown="true"' : ""} data-slot="dialog-content" tabindex="-1" class="${cn(
          DIALOG_CLS,
          !isTop && "pointer-events-none",
        )}" style="${appCenter(width)}">${content}${
          alert
            ? ""
            : `<button type="button" data-action="overlay-close" data-fk="close:${o.id}" class="${btnClass("ghost", "icon-sm", "absolute top-2 right-2")}">${icon("x")}<span class="sr-only">Close</span></button>`
        }</div></div>`;
      };

      /** Overlays register a renderer by type. */
      const OVERLAYS = {};
      const renderOverlay = (o, isTop) => OVERLAYS[o.type](o, isTop);

      /** A copy-to-clipboard button beside a mono value. The prototype never touches the clipboard; it says it copied. */
      const copyBtn = (value, label, fk) =>
        iconBtn({ action: "copy", id: value, fk, label, icon: "copy", tooltip: "Copy", cls: "size-6 p-0 [&_i]:text-[13px]" });

      /* ---------- tooltips (tooltip.tsx): hover or focus shows, Escape hides without moving focus ---------- */

      let tooltipTarget = null;
      const hideTooltip = () => {
        const tip = document.getElementById("app-tooltip");
        if (tip) tip.hidden = true;
        tooltipTarget = null;
      };
      const showTooltip = (el) => {
        let tip = document.getElementById("app-tooltip");
        if (!tip) {
          tip = document.createElement("div");
          tip.id = "app-tooltip";
          // Visual only: every trigger carries its text in its own name.
          tip.setAttribute("aria-hidden", "true");
          tip.className = "pointer-events-none fixed z-[70] w-fit max-w-xs rounded-md bg-foreground px-2 py-1 text-[11px] text-background shadow-md";
          document.body.appendChild(tip);
        }
        tip.textContent = el.dataset.tooltip;
        tip.hidden = false;
        const rect = el.getBoundingClientRect();
        const side = el.dataset.tooltipSide ?? "bottom";
        const left = rect.left + rect.width / 2 - tip.offsetWidth / 2;
        const top = side === "top" ? rect.top - tip.offsetHeight - 4 : rect.bottom + 4;
        tip.style.left = `${Math.max(4, Math.min(left, window.innerWidth - tip.offsetWidth - 4))}px`;
        tip.style.top = `${Math.max(4, Math.min(top, window.innerHeight - tip.offsetHeight - 4))}px`;
        tooltipTarget = el;
      };
      document.addEventListener("mouseover", (event) => {
        const el = event.target.closest?.("[data-tooltip]");
        if (el && el !== tooltipTarget) showTooltip(el);
        else if (!el && tooltipTarget && tooltipTarget !== document.activeElement) hideTooltip();
      });
      document.addEventListener("focusin", (event) => {
        const el = event.target.closest?.("[data-tooltip]");
        if (el && el.matches(":focus-visible")) showTooltip(el);
        else hideTooltip();
      });
      document.addEventListener(
        "keydown",
        (event) => {
          if (event.key !== "Escape" || !tooltipTarget || document.activeElement?.dataset?.terminalInput !== undefined) return;
          // The tooltip is the top layer: Escape dismisses it first (WCAG 1.4.13), as Radix does.
          event.stopPropagation();
          hideTooltip();
        },
        true,
      );

      /* ---------- the Scenarios panel (prototype chrome, outside the app and its dialogs) ---------- */

      const PANEL_ITEM =
        "flex w-full items-start gap-2 rounded-md px-2 py-1.5 text-left text-xs outline-none hover:bg-muted hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring/50";

      const scenarioStepItem = (step, index) => {
        const current = UI.stepIndex === index;
        return `<li><button type="button" data-action="run-step" data-id="${index}" data-fk="step:${index}" ${current ? 'aria-current="step"' : ""} class="${cn(
          PANEL_ITEM,
          current && "bg-muted font-medium text-foreground",
        )}"><span class="mt-px inline-flex size-5 shrink-0 items-center justify-center rounded-full border text-[10px] tabular-nums" aria-hidden="true">${index + 1}</span><span class="min-w-0 flex-1 leading-snug"><span class="sr-only">Step ${index + 1}: </span>${esc(
          step.title,
        )}</span></button></li>`;
      };

      const scenarioNote = () => {
        if (UI.stepIndex < 0) {
          return `<section id="scenario-note" data-fk="scenario-note" tabindex="-1" aria-label="How to use this prototype" class="shrink-0 border-t p-4 text-xs leading-relaxed text-muted-foreground outline-none"><p>Pick a step. Each step rebuilds the state it needs, so steps open in any order. Between steps the dashboard is live: dialogs submit, rows expand, the timeline scrubs, take control types into the terminal.</p></section>`;
        }
        const step = STEPS[UI.stepIndex];
        const last = UI.stepIndex === STEPS.length - 1;
        return `<section id="scenario-note" data-fk="scenario-note" tabindex="-1" aria-labelledby="scenario-note-title" class="max-h-[52%] shrink-0 overflow-y-auto border-t p-4 outline-none focus-visible:ring-2 focus-visible:ring-ring/50 focus-visible:ring-inset"><p class="text-[11px] text-muted-foreground">Step ${UI.stepIndex + 1} of ${STEPS.length}</p><h3 id="scenario-note-title" class="mt-1 text-sm leading-snug font-semibold">${esc(
          step.title,
        )}</h3><p class="mt-2 text-xs leading-relaxed">${esc(step.description)}</p><div class="mt-4 flex items-center justify-between gap-2">${btn({
          label: "Previous step",
          variant: "outline",
          size: "sm",
          icon: "arrow-left",
          action: "step-prev",
          disabled: UI.stepIndex === 0,
        })}${btn({ label: last ? "Last step" : "Next step", variant: "secondary", size: "sm", iconRight: "arrow-right", action: "step-next", disabled: last })}</div></section>`;
      };

      const renderPanel = () => {
        if (!UI.panelOpen) {
          return `<button type="button" data-action="panel-open" data-fk="panel-open" class="${btnClass(
            "outline",
            "sm",
            "fixed right-4 bottom-4 z-[55] shadow-md in-data-[overlay=open]:right-auto in-data-[overlay=open]:left-4",
          )}">${icon("list")}Scenarios<span class="sr-only">, show the panel</span></button>`;
        }
        const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        return `<aside aria-label="Scenarios" style="width: min(23rem, 100vw)" class="fixed inset-y-0 right-0 z-40 flex flex-col border-l bg-sidebar text-sidebar-foreground shadow-lg min-[900px]:shadow-none"><div class="flex shrink-0 flex-col gap-3 border-b p-4"><div class="flex items-start justify-between gap-2"><div><p class="text-[10px] font-medium tracking-wide text-muted-foreground uppercase">agent-terminal dashboard prototype</p><h2 class="text-sm font-semibold">Scenarios</h2></div>${btn(
          { label: "Hide the Scenarios panel", variant: "ghost", size: "icon-sm", icon: "panel-right-close", iconOnly: true, action: "panel-close" },
        )}</div><p class="text-xs leading-relaxed text-muted-foreground">Times in your browser's time zone (${esc(
          zone,
        )}). The clock is fixed at ${esc(fmtDateTime(PROTOTYPE_NOW))}.</p>${btn({
          label: "Reset prototype",
          variant: "outline",
          size: "xs",
          icon: "rotate-ccw",
          action: "reset-prototype",
          cls: "w-fit",
        })}</div><ol id="scenario-list" class="min-h-0 flex-1 space-y-0.5 overflow-y-auto p-2" aria-label="Steps">${STEPS.map(scenarioStepItem).join(
          "",
        )}</ol>${scenarioNote()}</aside>`;
      };

      const focusByKey = (fk) => document.querySelector(`[data-fk="${CSS.escape(fk)}"]`)?.focus({ preventScroll: true });
      /** Focus a control and bring it into view (scenario steps). */
      const focusIntoView = (fk) => {
        const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
        if (!el) return;
        el.focus({ preventScroll: true });
        el.scrollIntoView({ block: "nearest" });
      };

      Object.assign(ACTIONS, {
        "skip-to-content": () => document.getElementById("main-content")?.focus(),
        "overlay-close": () => closeOverlay(),
        // The backdrop of a Dialog: a click outside the content closes it (alert dialogs have no handler).
        "overlay-dismiss": () => closeOverlay(),
        "panel-close": () => {
          UI.panelOpen = false;
          render();
          focusByKey("panel-open");
        },
        "panel-open": () => {
          UI.panelOpen = true;
          render();
          focusByKey("panel-close");
        },
        "run-step": (el) => runStep(Number(el.dataset.id)),
        "step-prev": () => runStep(Math.max(0, UI.stepIndex - 1)),
        "step-next": () => runStep(Math.min(STEPS.length - 1, UI.stepIndex + 1)),
        "reset-prototype": () => resetPrototype(),
        copy: (el) => toast("success", "Copied", el.dataset.id),
      });

      /* ============================================================================
       * Runtime: routing, rendering (focus, selection and scroll kept), the theme, overlays (focus-trapped, Escape closes,
       * focus returns to the trigger), toasts, announcements, event delegation, the scenario runner.
       * ========================================================================== */

      const $app = document.getElementById("app");
      const $panel = document.getElementById("panel-root");
      const $overlay = document.getElementById("overlay-root");
      const $toaster = document.getElementById("toaster");
      const $announcer = document.getElementById("route-announcer");
      const $politeAnnouncer = document.getElementById("polite-announcer");

      /* ---------- routing ---------- */

      /** The dashboard opens on "/", which shows the first open tab (or the empty states). */
      const HOME = "/";
      const currentRoute = () => location.hash.replace(/^#/, "") || HOME;
      const currentPath = () => currentRoute().split("?")[0];
      /** Goes to a route; the route already shown is rendered again. */
      const goTo = (route) => {
        if (currentRoute() === route) render();
        else location.hash = route;
      };
      const navigate = (path) => goTo(path);

      const resolveScreen = (path) => {
        for (const [pattern, build] of ROUTES) {
          const match = path.match(pattern);
          if (match) return build(match);
        }
        return screenNotFound();
      };

      /* ---------- render with focus, selection and scroll kept ---------- */

      const captureFocus = () => {
        const el = document.activeElement;
        if (!el || el === document.body) return null;
        const fk = el.dataset?.fk;
        if (!fk) return null;
        const sel = typeof el.selectionStart === "number" ? [el.selectionStart, el.selectionEnd] : null;
        return { fk, sel };
      };
      /** Returns false when the focused control is gone after a re-render. */
      const restoreFocus = (saved) => {
        if (!saved) return true;
        const el = document.querySelector(`[data-fk="${CSS.escape(saved.fk)}"]`);
        if (!el) return false;
        el.focus({ preventScroll: true });
        if (saved.sel && typeof el.setSelectionRange === "function") {
          try {
            el.setSelectionRange(saved.sel[0], saved.sel[1]);
          } catch {
            /* inputs such as checkboxes do not support selection */
          }
        }
        return true;
      };

      /** The Scenarios panel lives outside #app, so it stays usable while a dialog makes the app inert. */
      const renderPanelRoot = () => {
        const list = document.getElementById("scenario-list");
        const top = list?.scrollTop ?? 0;
        $panel.innerHTML = renderPanel();
        const next = document.getElementById("scenario-list");
        if (next) next.scrollTop = top;
      };

      /** Scroll boxes that keep their place across renders (data-scroll-key); a following log sticks to its bottom. */
      const captureScroll = () => new Map([...$app.querySelectorAll("[data-scroll-key]")].map((el) => [el.dataset.scrollKey, el.scrollTop]));
      const restoreScroll = (saved) => {
        $app.querySelectorAll("[data-scroll-key]").forEach((el) => {
          if (el.dataset.follow === "true") el.scrollTop = el.scrollHeight;
          else if (saved.has(el.dataset.scrollKey)) el.scrollTop = saved.get(el.dataset.scrollKey);
        });
      };

      let lastPath = null;
      const render = () => {
        hideTooltip();
        const redirect = routeRedirect(currentRoute());
        if (redirect) history.replaceState(null, "", `#${redirect}`);
        const saved = captureFocus();
        const scroll = captureScroll();
        const path = currentPath();
        const screen = resolveScreen(path);
        document.title = `${screen.title} · agent-terminal`;
        document.documentElement.dataset.panel = UI.panelOpen ? "open" : "closed";
        $app.innerHTML = renderShell(screen);
        restoreScroll(path === lastPath ? scroll : new Map());
        renderPanelRoot();
        renderOverlays();
        if (path !== lastPath) {
          $announcer.textContent = screen.title;
          lastPath = path;
        }
        // Focus never drops to <body>: when the focused control left, the open dialog or the main region takes it (WCAG 2.4.3).
        if (!restoreFocus(saved)) {
          if (UI.overlays.length) focusFirst();
          else document.getElementById("main-content")?.focus({ preventScroll: true });
        }
        if (UI.pendingFocus && !UI.overlays.length) {
          const fk = UI.pendingFocus;
          UI.pendingFocus = null;
          focusIntoView(fk);
        }
      };
      /** A new route closes what the old one had open. */
      window.addEventListener("hashchange", () => {
        if (currentPath() !== lastPath) UI.overlays = [];
        render();
      });

      /* ---------- theme (agent-browser: light and dark, class on <html>; dark by default) ---------- */

      const applyTheme = () => {
        const dark = UI.theme === "dark";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      };

      /* ---------- toasts (see the CSS: not in the app) ---------- */

      const TOAST_ICONS = { success: "circle-check", error: "circle-alert", warning: "triangle-alert", info: "info" };
      const toast = (type, title, description = "") => {
        const node = document.createElement("div");
        node.className = "toast";
        node.dataset.type = type;
        node.setAttribute("role", type === "error" ? "alert" : "status");
        node.innerHTML = `${icon(TOAST_ICONS[type] ?? "info", "mt-0.5 text-[14px]")}<div class="min-w-0 flex-1"><div class="font-medium">${esc(title)}</div>${
          description ? `<div class="mt-0.5 font-mono text-[11px] opacity-80">${esc(description)}</div>` : ""
        }</div><button type="button" class="-mt-1 -mr-1 inline-flex size-6 items-center justify-center rounded opacity-60 hover:opacity-100 focus-visible:outline-2 focus-visible:outline-current" aria-label="Close notification">${icon("x", "text-[13px]")}</button>`;
        node.querySelector("button").addEventListener("click", () => node.remove());
        $toaster.prepend(node);
        while ($toaster.children.length > 3) $toaster.lastElementChild.remove();
        setTimeout(() => node.remove(), type === "error" || type === "warning" ? 9000 : 5000);
      };
      const clearToasts = () => ($toaster.innerHTML = "");

      /** Polite announcements (a row appended, a frame shown): cleared first so the same text is read again. */
      const announce = (text) => {
        $politeAnnouncer.textContent = "";
        setTimeout(() => ($politeAnnouncer.textContent = text), 30);
      };

      /* ---------- overlays: dialogs ---------- */

      const FOCUSABLE =
        'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
      const topOverlay = () => UI.overlays[UI.overlays.length - 1] ?? null;

      /** Opens a dialog over the app and returns it (the live object, which later re-renders read). */
      const openOverlay = (overlay) => {
        const trigger = document.activeElement?.dataset?.fk ?? null;
        const opened = { id: newId("ov"), returnFocus: trigger, ...overlay };
        UI.overlays.push(opened);
        renderOverlays();
        focusFirst();
        return opened;
      };
      const focusFirst = () => {
        const top = $overlay.lastElementChild?.querySelector("[data-overlay-content]");
        if (!top) return;
        const target = top.querySelector("[data-autofocus]") ?? top.querySelector(FOCUSABLE) ?? top;
        target.focus({ preventScroll: true });
      };
      /** Focus goes back to the trigger; if the trigger is gone, to the dialog underneath or the main region. */
      const closeOverlay = () => {
        const closing = UI.overlays.pop();
        renderOverlays();
        const trigger = closing?.returnFocus ? document.querySelector(`[data-fk="${CSS.escape(closing.returnFocus)}"]`) : null;
        if (trigger) trigger.focus({ preventScroll: true });
        else if (UI.overlays.length) focusFirst();
        else document.getElementById("main-content")?.focus({ preventScroll: true });
      };
      const renderOverlays = () => {
        const saved = captureFocus();
        $overlay.innerHTML = UI.overlays.map((o, i) => renderOverlay(o, i === UI.overlays.length - 1)).join("");
        // Rendered once: later re-renders carry data-shown, so the entry animation does not replay while typing.
        UI.overlays.forEach((o) => (o.shown = true));
        document.documentElement.dataset.overlay = UI.overlays.length ? "open" : "closed";
        $app.inert = UI.overlays.length > 0;
        if (saved && $overlay.contains(document.querySelector(`[data-fk="${CSS.escape(saved.fk)}"]`))) restoreFocus(saved);
      };
      /** Re-render only the overlays (typing in a dialog must not rebuild the page). */
      const refreshOverlay = () => {
        const saved = captureFocus();
        renderOverlays();
        restoreFocus(saved);
      };
      /** Scenario steps press the top dialog's submit button the way a person would. */
      const pressDialogSubmit = () => $overlay.lastElementChild?.querySelector('[data-overlay-content] button[type="submit"]')?.click();

      /* ---------- event delegation ---------- */

      /** data-bind prefixes: o = the top dialog, else UI. */
      const bindRoot = (prefix) => (prefix === "o" ? topOverlay() : UI);
      const setPath = (root, path, value) => {
        const keys = path.split(".");
        let node = root;
        for (const key of keys.slice(0, -1)) node = node[key] ??= {};
        node[keys[keys.length - 1]] = value;
      };
      const handleBind = (el) => {
        const [prefix, path] = el.dataset.bind.split(":");
        const root = bindRoot(prefix);
        if (!root) return;
        const value = el.type === "checkbox" ? el.checked : el.value;
        setPath(root, path, value);
        if (root.errors) delete root.errors[path];
        // data-after names an action that reacts to the new value.
        if (el.dataset.after) ACTIONS[el.dataset.after]?.(el);
        if (el.dataset.rerender !== undefined) {
          if (prefix === "o") refreshOverlay();
          else render();
        }
      };
      document.addEventListener("input", (event) => {
        const el = event.target.closest("[data-bind]");
        if (el && el.type !== "checkbox" && el.type !== "radio" && el.tagName !== "SELECT") handleBind(el);
        const range = event.target.closest("input[data-scrub]");
        if (range) ACTIONS["scrub"](range);
      });
      document.addEventListener("change", (event) => {
        const el = event.target.closest("[data-bind]");
        if (el && (el.type === "checkbox" || el.type === "radio" || el.tagName === "SELECT")) handleBind(el);
        const changed = event.target.closest("[data-change]");
        if (changed) ACTIONS[changed.dataset.change]?.(changed);
      });
      document.addEventListener("click", (event) => {
        const actionEl = event.target.closest("[data-action]");
        if (!actionEl || actionEl.getAttribute("aria-disabled") === "true" || actionEl.disabled) return;
        const handler = ACTIONS[actionEl.dataset.action];
        if (!handler) return;
        if (actionEl.tagName === "A" || actionEl.type === "submit") event.preventDefault();
        handler(actionEl, event);
      });
      document.addEventListener("submit", (event) => {
        const form = event.target.closest("form[data-submit]");
        if (!form) return;
        event.preventDefault();
        ACTIONS[form.dataset.submit]?.(form, event);
      });
      document.addEventListener("keydown", (event) => {
        // A terminal the human controls takes every key (see "take control"); nothing below runs for it.
        if (event.target.closest?.("[data-terminal-input]")) return;
        if (event.key === "Escape") {
          if (UI.overlays.length) {
            event.preventDefault();
            closeOverlay();
          }
          return;
        }
        // Tabs (Radix Tabs): arrow keys move between triggers, Home and End jump, the focused one is selected.
        const tab = event.target.closest?.('[role="tab"]');
        if (tab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) {
          const tabs = [...tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]')];
          const i = tabs.indexOf(tab);
          const next =
            event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 : (i + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
          event.preventDefault();
          tabs[next].click();
          focusByKey(tabs[next].dataset.fk);
          return;
        }
        // A resizable handle (react-resizable-panels): arrow keys move it.
        const handle = event.target.closest?.('[role="separator"][data-resize]');
        if (handle && ["ArrowLeft", "ArrowRight"].includes(event.key)) {
          event.preventDefault();
          ACTIONS["resize-by"](handle, event.key === "ArrowRight" ? 2 : -2);
          return;
        }
        // The Scenarios panel is prototype chrome, outside the modal: Tab moves freely inside it.
        if (event.key === "Tab" && UI.overlays.length && !$panel.contains(document.activeElement)) {
          const content = $overlay.lastElementChild?.querySelector("[data-overlay-content]");
          if (!content) return;
          const focusables = [...content.querySelectorAll(FOCUSABLE)].filter((el) => el.offsetParent !== null || el === document.activeElement);
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (event.shiftKey && (document.activeElement === first || !content.contains(document.activeElement))) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && (document.activeElement === last || !content.contains(document.activeElement))) {
            event.preventDefault();
            first.focus();
          }
        }
      });

      /* ---------- the scenario runner ---------- */

      /** Screen state a step starts from. Theme and the Scenarios panel are the reviewer's own and survive. */
      const resetUiState = () => {
        UI.overlays = [];
        UI.pendingFocus = null;
        UI.panelTab = "activity";
        UI.view = {};
        UI.expanded = {};
        UI.cmdOpen = {};
        UI.follow = true;
        UI.outputRaw = false;
        UI.outputQuery = "";
        UI.splitFocus = 0;
        UI.collapsed = {};
        UI.leftPct = 15;
        UI.rightPct = 30;
        UI.keyChord = false;
      };

      /** The world a step starts from: the baseline, the clock at 14:02:30, the id sequence from zero. */
      let world = 0;
      const resetWorld = () => {
        S = clone(BASE);
        clockTicks = 0;
        idSeq = 0;
        // A timer an earlier step left running (a first frame arriving, the agent retrying) finds another world and does nothing.
        world += 1;
      };
      /** Runs fn later, only if the world it was scheduled in is still the one shown. */
      const later = (ms, fn) => {
        const mine = world;
        setTimeout(() => mine === world && fn(), ms);
      };

      /** A step's note takes focus, unless Previous or Next keeps it so the keyboard can page through steps. */
      const focusScenarioNote = ({ paging }) =>
        paging || (document.getElementById("scenario-note") ?? document.getElementById("main-content"))?.focus({ preventScroll: true });

      /** Each step rebuilds its own state from the baseline, so steps open in any order. */
      const runStep = (index) => {
        const step = STEPS[index];
        const paging = ["step-prev", "step-next"].includes(document.activeElement?.dataset?.fk);
        clearToasts();
        resetUiState();
        resetWorld();
        step.before?.();
        if (step.theme) {
          UI.theme = step.theme;
          applyTheme();
        }
        UI.stepIndex = index;
        lastPath = null;
        renderOverlays();
        goTo(step.route);
        setTimeout(() => document.querySelector('#scenario-list [aria-current="step"]')?.scrollIntoView({ block: "nearest" }), 40);
        setTimeout(() => (step.open ?? focusScenarioNote)({ paging }), 80);
        if (paging) setTimeout(() => ($announcer.textContent = `Step ${index + 1} of ${STEPS.length}: ${step.title}`), 120);
      };

      const resetPrototype = () => {
        clearToasts();
        resetUiState();
        resetWorld();
        UI.stepIndex = -1;
        lastPath = null;
        goTo(HOME);
      };

      /* ============================================================================
       * The terminal grid (should become dashboard/src/components/terminal-grid.tsx, fed by the daemon's frames over the
       * stream WebSocket). A grid is rows × cols cells, each [char, style]; the dashboard renders it as spans in a <pre>, never
       * as an image, so text stays selectable and a frame is a few KB. Style tokens: fN foreground and bN background (ANSI
       * 0–15), B bold, D dim, U underline, I inverse. `snapshot` text and `get cell` read the same grid.
       * ========================================================================== */

      const blankGrid = (cols, rows) => ({
        cols,
        rows,
        cells: Array.from({ length: rows }, () => Array.from({ length: cols }, () => [" ", ""])),
        cursor: null,
      });
      /** Writes text at row r, column c (1-based, as `snapshot` and `get cell` count). */
      const put = (g, r, c, text, st = "") => {
        const row = g.cells[r - 1];
        if (!row) return;
        [...text].forEach((ch, i) => {
          const col = c - 1 + i;
          if (col >= 0 && col < g.cols) row[col] = [ch, st];
        });
      };
      /** Gives a run of cells a style, keeping their characters (a selected line's background). */
      const paint = (g, r, c, w, st) => {
        const row = g.cells[r - 1];
        for (let col = c - 1; col < c - 1 + w && col < g.cols; col += 1) row[col] = [row[col][0], mergeStyle(row[col][1], st)];
      };
      /** A style laid over another: its colours replace the ones underneath, its flags add to them. */
      const mergeStyle = (base, add) => {
        const extra = add.split(" ").filter(Boolean);
        const hasF = extra.some((x) => /^f\d+$/.test(x));
        const hasB = extra.some((x) => /^b\d+$/.test(x));
        const kept = base.split(" ").filter((x) => x && !(hasF && /^f\d+$/.test(x)) && !(hasB && /^b\d+$/.test(x)));
        return cn(...kept, ...extra);
      };
      /** Writes a line of markup ("[[g:ok]] text", see parseMarkup) at row r. */
      const putMarkup = (g, r, c, markup) => {
        let col = c;
        parseMarkup(markup).forEach(([text, st]) => {
          put(g, r, col, text, st);
          col += [...text].length;
        });
      };
      /** A rounded box as lazygit and most TUIs draw it, its title set into the top border, an optional footer into the bottom. */
      const box = (g, r, c, h, w, { title = "", footer = "", st = "", titleSt = st } = {}) => {
        for (let i = 0; i < h; i += 1) put(g, r + i, c, " ".repeat(w));
        put(g, r, c, `╭${"─".repeat(w - 2)}╮`, st);
        put(g, r + h - 1, c, `╰${"─".repeat(w - 2)}╯`, st);
        for (let i = 1; i < h - 1; i += 1) {
          put(g, r + i, c, "│", st);
          put(g, r + i, c + w - 1, "│", st);
        }
        if (title) put(g, r, c + 1, title, titleSt);
        if (footer) put(g, r + h - 1, c + w - 1 - [...footer].length - 1, footer, st);
      };

      /**
       * A tiny markup for coloured output, used by the seed data: "[[g:Finished]]" is green. The same lines feed the terminal
       * grid, the Commands output, the Output stream and its raw view (as the SGR sequences the program wrote).
       */
      const MARKUP = {
        g: { st: "f2", cls: "ansi-g", sgr: "32" },
        G: { st: "f2 B", cls: "ansi-g ansi-b", sgr: "1;32" },
        r: { st: "f1", cls: "ansi-r", sgr: "31" },
        R: { st: "f1 B", cls: "ansi-r ansi-b", sgr: "1;31" },
        y: { st: "f3", cls: "ansi-y", sgr: "33" },
        c: { st: "f6", cls: "ansi-c", sgr: "36" },
        m: { st: "f5", cls: "ansi-m", sgr: "35" },
        b: { st: "B", cls: "ansi-b", sgr: "1" },
        d: { st: "f8", cls: "ansi-d", sgr: "2" },
      };
      const parseMarkup = (markup) => {
        const out = [];
        let last = 0;
        for (const m of markup.matchAll(/\[\[(\w):(.*?)\]\]/g)) {
          if (m.index > last) out.push([markup.slice(last, m.index), ""]);
          out.push([m[2], MARKUP[m[1]]?.st ?? ""]);
          last = m.index + m[0].length;
        }
        if (last < markup.length) out.push([markup.slice(last), ""]);
        return out;
      };
      const plainOf = (markup) => markup.replace(/\[\[\w:(.*?)\]\]/g, "$1");
      /** Markup as HTML, with the dashboard's ANSI colours (Commands output, Output). */
      const markupHtml = (markup) => esc(markup).replace(/\[\[(\w):(.*?)\]\]/g, (_, tag, text) => `<span class="${MARKUP[tag]?.cls ?? ""}">${text}</span>`);
      /** Markup as the bytes the program wrote, escapes made visible (␛), for Output's Raw view. */
      const markupRaw = (markup) => markup.replace(/\[\[(\w):(.*?)\]\]/g, (_, tag, text) => `␛[${MARKUP[tag]?.sgr ?? "0"}m${text}␛[0m`);

      /* ---------- render: runs of equal style become one span ---------- */

      const styleCache = new Map();
      const styleClass = (st) => {
        if (styleCache.has(st)) return styleCache.get(st);
        const t = st.split(" ").filter(Boolean);
        let fg = t.find((x) => /^f\d+$/.test(x));
        let bg = t.find((x) => /^b\d+$/.test(x));
        let fgCls = fg ? `t${fg}` : "";
        let bgCls = bg ? `t${bg}` : "";
        if (t.includes("I")) [fgCls, bgCls] = [bg ? `tf${bg.slice(1)}` : "tfbg", fg ? `tb${fg.slice(1)}` : "tbfg"];
        const cls = cn(fgCls, bgCls, t.includes("B") && "tB", t.includes("D") && "tD", t.includes("U") && "tU");
        styleCache.set(st, cls);
        return cls;
      };
      /**
       * renderGrid(g, { label, live, dim, diff, thumb }): the grid as a <pre>. diff: another grid of the same size; the cells
       * that differ carry .tdiff. The <pre> is named by its label and read as text.
       */
      const renderGrid = (g, { label, live = false, dim = false, diff = null, thumb = false, cursor = true } = {}) => {
        const rows = g.cells.map((row, r) => {
          let html = "";
          let run = "";
          let runCls = null;
          const flush = () => {
            if (!run) return;
            const text = esc(run);
            html += runCls ? `<span class="${runCls}">${text}</span>` : text;
            run = "";
          };
          row.forEach(([ch, st], c) => {
            const isCursor = cursor && g.cursor && g.cursor[0] === r + 1 && g.cursor[1] === c + 1;
            const changed = diff && (diff.cells[r]?.[c]?.[0] !== ch || diff.cells[r]?.[c]?.[1] !== st);
            const cls = cn(styleClass(st), isCursor && "tcur", changed && "tdiff");
            if (cls !== runCls) {
              flush();
              runCls = cls;
            }
            run += ch;
          });
          flush();
          return html;
        });
        return `<pre class="${cn("term", live && "term-live", dim && "is-dim", thumb && "term-thumb")}" style="--cols: ${g.cols}; --rows: ${g.rows}" aria-label="${esc(
          label,
        )}">${rows.join("\n")}</pre>`;
      };
      /** How many cells differ between two grids of the same size. */
      const changedCells = (a, b) =>
        a.cells.reduce((n, row, r) => n + row.filter((cell, c) => cell[0] !== b.cells[r]?.[c]?.[0] || cell[1] !== b.cells[r]?.[c]?.[1]).length, 0);

      /** `get cell r c`: the character and its style, as the CLI prints it. */
      const ANSI_NAMES = ["black", "red", "green", "yellow", "blue", "magenta", "cyan", "white"];
      const cellDesc = (g, r, c) => {
        const [ch, st] = g.cells[r - 1][c - 1];
        const t = st.split(" ");
        const colour = (prefix) => {
          const v = t.find((x) => new RegExp(`^${prefix}\\d+$`).test(x));
          return v ? ANSI_NAMES[Number(v.slice(1)) % 8] : "default";
        };
        return `"${ch}" fg=${colour("f")} bg=${colour("b")} bold=${t.includes("B")} inverse=${t.includes("I")}`;
      };
      /** `snapshot` text: the header line, then numbered rows; trailing blank rows folded. */
      const snapshotText = (g, header, { rows = null } = {}) => {
        const lines = g.cells.map((row) =>
          row
            .map(([ch]) => ch)
            .join("")
            .replace(/\s+$/, ""),
        );
        let last = lines.length;
        while (last > 0 && !lines[last - 1]) last -= 1;
        const [from, to] = rows ?? [1, last];
        const width = String(to).length;
        const body = lines.slice(from - 1, to).map((line, i) => `${String(from + i).padStart(width)}│${line}`);
        return [header, ...body].join("\n");
      };

      /* ============================================================================
       * Program screens. Each returns the grid a real program would leave in the PTY at a given state: lazygit on this repo,
       * zsh (from its output lines), the repost chat TUI and htop. The daemon owns the real grid; these stand in for it.
       * ========================================================================== */

      /* ---------- lazygit 0.55 on ~/github.com/repost-sh/agent-terminal, 120 × 36 ---------- */

        put(g, 17, 3, "   docs/design-draft");

            lines = [
              `[[b:diff --git a/${file.path} b/${file.path}]]`,

      const shellRun = (cwd, branch, cmds, firstFrame = 2) => {

              start: cmd.start,

              endFrame: cmd.endFrame,
              from,
              to: lines.length,

          return { on: false, path };
        }
        tab.rec = { path: `~/.agent-terminal/recordings/${tab.session}-${tab.id}-${tab.frame}.cast` };
        return { on: true, path: tab.rec.path };
      };

      /** Opens a program in a session (new or existing), as `agent-terminal --session <s> open|shell …` does. */
      const openProgram = (form) => {
        const program = form.command.trim();
        const word = program.split(/\s+/)[0];
        const name = form.mode === "new" ? form.name.trim() : form.existing;
        let session = sessionOf(name);
        if (!session) {
          session = { name, tabs: [] };
          S.sessions.push(session);
        }
        const id = `t${session.tabs.reduce((n, t) => Math.max(n, Number(t.id.slice(1))), 0) + 1}`;
        const shell = SHELLS.includes(word);
        const size =
          form.size === "custom"
            ? { cols: Number(form.cols), rows: Number(form.rows) }
            : { cols: Number(form.size.split("x")[0]), rows: Number(form.size.split("x")[1]) };
        const cwd = form.cwd.trim() || "~";
        const kind = word === "lazygit" ? "lazygit" : shell ? "shell" : word === "repost" ? "chat" : word === "htop" ? "htop" : "plain";
        const tab = newTab(name, id, {
          program,
          kind,
          shell,
          integration: shell && integrationOn(form),
          cwd,
          size,
          pid: 49001 + allTabs().length,
          modes: shell ? MODES_SHELL : MODES_TUI,
          startedAt: stamp(),
          frame: 0,
          stream: "loading",
        });
        if (shell) tab.lines = [{ f: 1, m: prompt(cwd, cwd.includes("github.com") ? "main" : "", false), p: prompt(cwd, "", false), cmd: "", prevExit: 0 }];
        session.tabs.push(tab);
        return tab;
      };
      /** Shell integration defaults to on for shells; the toggle only overrides it. */
      const integrationOn = (form) => (form.integration === null ? true : form.integration);

      /* ============================================================================
       * Shell: the three resizable columns of the agent-browser dashboard (dashboard/src/app/page.tsx there: sessions 15%,
       * viewport 55%, panel 30%), the sessions sidebar, and the resizable handles.
       * ========================================================================== */

      /* ---------- the sessions sidebar (should become components/sessions-sidebar.tsx) ---------- */

      /** The tab row's leading glyph: a live dot while running, a hand while a human controls it, a hollow ring once exited. */
      const tabGlyph = (tab) => {
        const state = tabState(tab);
        if (state.kind === "human") return icon("hand", "flex size-4 items-center justify-center text-[13px] text-yellow-700 dark:text-warning");
        if (state.kind === "running") return `<span class="flex size-4 shrink-0 items-center justify-center">${dot("success")}</span>`;
        return `<span class="flex size-4 shrink-0 items-center justify-center" aria-hidden="true"><span class="size-2 rounded-full border border-muted-foreground/70"></span></span>`;
      };
      /** Decision: a running tab shows only its live dot; exited and human carry a chip with the word. */
      const tabChip = (tab) => {
        const state = tabState(tab);
        return state.kind === "running" ? "" : chip(state.label, state.tone);
      };

      const tabRow = (tab, selected, splitMode) => {
        const state = tabState(tab);
        return `<li><a href="#/s/${esc(tab.session)}/${esc(tab.id)}" ${splitMode ? `data-action="sidebar-tab" data-id="${esc(tabKey(tab))}"` : ""} data-fk="tab:${esc(
          tabKey(tab),
        )}" ${selected ? 'aria-current="page"' : ""} class="${cn(
          "flex w-full min-w-0 items-center gap-2 py-1 pr-1 pl-7 text-left text-xs outline-none select-none focus-visible:ring-2 focus-visible:ring-ring/50 focus-visible:ring-inset",
          selected ? "bg-card text-foreground" : "text-muted-foreground hover:text-foreground",
        )}">${tabGlyph(tab)}<span class="min-w-0 flex-1 break-all">${esc(tab.program)}</span><span class="sr-only">, ${esc(tabName(tab))}, ${esc(state.label)}</span>${tabChip(
          tab,
        )}</a></li>`;
      };

      const sessionGroup = (session, current, splitMode) => {
        const open = !UI.collapsed[session.name];
        const active = current?.session === session.name;
        const listId = `tabs-${session.name}`;
        return `<div><button type="button" data-action="toggle-session" data-id="${esc(session.name)}" data-fk="session:${esc(session.name)}" aria-expanded="${open}" aria-controls="${esc(
          listId,
        )}" class="${cn(
          "flex w-full items-center text-xs transition-colors outline-none select-none focus-visible:ring-2 focus-visible:ring-ring/50 focus-visible:ring-inset",
          active ? "text-foreground" : "text-muted-foreground hover:text-foreground",
        )}"><span class="flex size-6 shrink-0 items-center justify-center">${icon("chevron-right", cn("text-[12px] transition-transform", open && "rotate-90"))}</span><span class="flex min-w-0 flex-1 items-center gap-2 py-1.5 pr-3 pl-1 text-left">${icon(
          "square-terminal",
          "text-[15px]",
        )}<span class="min-w-0 font-mono font-semibold break-all">${esc(session.name)}</span>${badge(String(session.tabs.length), "secondary", "ml-auto")}<span class="sr-only">, ${
          session.tabs.length
        } ${session.tabs.length === 1 ? "tab" : "tabs"}</span></span></button><ul id="${esc(listId)}" ${open ? "" : "hidden"} class="pb-1">${session.tabs
          .map((tab) => tabRow(tab, current === tab, splitMode))
          .join("")}<li><button type="button" data-action="new-tab" data-id="${esc(session.name)}" data-fk="new-tab:${esc(
          session.name,
        )}" class="flex w-full items-center gap-2 py-1 pr-1 pl-7 text-xs text-muted-foreground outline-none hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring/50 focus-visible:ring-inset">${icon(
          "plus",
        )}New tab<span class="sr-only"> in ${esc(session.name)}</span></button></li></ul></div>`;
      };

      const renderSidebar = (current, splitMode) => {
        const up = S.daemon === "up";
        const list = !up
          ? `<p class="py-4 text-center text-xs text-muted-foreground">Not connected</p>`
          : S.sessions.length
            ? S.sessions.map((session) => sessionGroup(session, current, splitMode)).join("")
            : `<p class="py-4 text-center text-xs text-muted-foreground">No sessions</p>`;
        return `<aside aria-label="Sessions" class="col-left flex min-h-0 shrink-0 flex-col" style="width: ${UI.leftPct}%; min-width: 12rem; max-width: 30%"><div class="flex shrink-0 items-center px-3 py-2"><h2 class="text-xs font-normal text-muted-foreground">Sessions</h2><div class="ml-auto flex items-center gap-0.5">${iconBtn(
          {
            head: true,
            action: "theme-toggle",
            label: UI.theme === "dark" ? "Switch to light mode" : "Switch to dark mode",
            icon: UI.theme === "dark" ? "sun" : "moon",
          },
        )}${iconBtn({ head: true, action: "close-all", label: "Close all sessions", icon: "trash-2", disabled: !up || !S.sessions.length })}${iconBtn({
          head: true,
          action: "new-session",
          label: "New session",
          icon: "plus",
          disabled: !up,
        })}</div></div><div class="h-px shrink-0 bg-border"></div><nav aria-label="Sessions and tabs" class="min-h-0 flex-1 overflow-y-auto py-1">${list}</nav></aside>`;
      };

      /* ---------- the resizable handles (react-resizable-panels: a 1px line; the hit area here is 24px) ---------- */

      const PCT_LIMITS = { left: [10, 30], right: [15, 50] };
      const setPct = (side, pct) => {
        const [min, max] = PCT_LIMITS[side];
        const value = Math.round(Math.min(max, Math.max(min, pct)));
        if (side === "left") UI.leftPct = value;
        else UI.rightPct = value;
        return value;
      };
      /** Not in the app: the handle is 24px wide (a 1px line in its middle) so it meets WCAG 2.5.8; agent-browser's is 4px. */
      const resizeHandle = (side) =>
        `<div role="separator" aria-orientation="vertical" aria-label="${side === "left" ? "Resize the sessions sidebar" : "Resize the side panel"}" aria-valuenow="${
          side === "left" ? UI.leftPct : UI.rightPct
        }" aria-valuemin="${PCT_LIMITS[side][0]}" aria-valuemax="${PCT_LIMITS[side][1]}" tabindex="0" data-resize="${side}" data-fk="resize:${side}" class="relative z-10 -mx-3 w-6 shrink-0 cursor-col-resize touch-none outline-none before:absolute before:inset-y-0 before:left-1/2 before:w-px before:-translate-x-1/2 before:bg-border hover:before:bg-ring focus-visible:before:w-0.5 focus-visible:before:bg-ring"></div>`;

      /** The whole dashboard around a screen ({ title, h1, center, right, current, split }). */
      const renderShell = (screen) =>
        `<div class="shell fixed inset-y-0 left-0 bg-background" style="right: var(--panel-w)"><div id="main-scroll" class="shell-cols flex h-full min-h-0 w-full">${renderSidebar(
          screen.current,
          !!screen.split,
        )}${resizeHandle("left")}<main id="main-content" tabindex="-1" data-fk="main-content" class="col-center flex min-h-0 min-w-0 flex-1 flex-col outline-none"><h1 class="sr-only">${esc(
          screen.h1,
        )}</h1>${screen.center}</main>${screen.right ? `${resizeHandle("right")}${screen.right}` : ""}</div></div>`;

      /* ============================================================================
       * The center column (should become components/terminal-view.tsx): toolbar, the terminal, the timeline, the status bar.
       * ========================================================================== */

      const SEP = `<div class="h-px shrink-0 bg-border" role="none"></div>`;
      const LAYOUTS = [
        { n: 1, icon: "square", label: "Single terminal" },
        { n: 2, icon: "columns-2", label: "Two terminals side by side" },
        { n: 4, icon: "grid-2x2", label: "Four terminals" },
      ];

      /* ---------- toolbar ---------- */

      const renderToolbar = (tab, layout) => {
        const key = tabKey(tab);
        const human = tab.control === "human";
        const recording = !!tab.rec;
        // Decision: the field shows the program and its cwd (dimmed); the size is shown once, in the status bar.
        const field = `<div role="group" aria-label="Command line" class="flex min-w-0 flex-1 flex-wrap items-baseline gap-x-2 rounded-md bg-muted px-2.5 py-1 font-mono text-xs"><span class="break-all text-foreground">${esc(
          tab.program,
        )}</span><span class="break-all text-muted-foreground/70">${esc(tab.cwd)}</span></div>`;
        const recordInner = recording
          ? `<span class="flex size-4 items-center justify-center" aria-hidden="true"><span class="size-2.5 rounded-full bg-red-500"></span></span>`
          : icon("circle");
        const layoutGroup = `<div role="group" aria-label="Layout" class="flex items-center">${LAYOUTS.map((l) =>
          iconBtn({ action: "layout", id: String(l.n), label: l.label, icon: l.icon, pressed: layout === l.n, tooltip: l.label }),
        ).join("")}</div>`;
        // Decision: Take control waits while the process has exited, the stream reconnects or the first frame is coming.
        const canControl = tab.status === "running" && tab.stream === "live";
        return `<div class="flex shrink-0 flex-wrap items-center gap-1.5 px-2 py-1.5">${field}<div class="flex flex-wrap items-center gap-1.5">${iconBtn({
          action: "restart",
          id: key,
          label: `Restart ${tab.program}`,
          icon: "rotate-cw",
          tooltip: "Restart",
          disabled: tab.stream !== "live",
        })}${iconBtn({ action: "screenshot", id: key, label: "Take a screenshot", icon: "camera", tooltip: "Screenshot", disabled: tab.stream === "loading" })}${iconBtn(
          {
            action: "record",
            id: key,
            label: recording ? "Stop recording" : "Start recording",
            inner: recordInner,
            pressed: recording,
            tooltip: recording ? `Recording to ${tab.rec.path}` : "Record",
            disabled: tab.status !== "running",
          },
        )}${layoutGroup}${btn({
          label: human ? "Release control" : "Take control",
          variant: human ? "default" : "outline",
          size: "sm",
          icon: "hand",
          action: "take-control",
          id: key,
          fk: `take-control:${key}`,
          disabled: !canControl,
        })}</div></div>`;
      };
      /** The toolbar of a split whose cells are all empty: only the layout switch. */
      const renderLayoutOnlyToolbar = (layout) =>
        `<div class="flex shrink-0 items-center justify-end gap-1.5 px-2 py-1.5"><div role="group" aria-label="Layout" class="flex items-center">${LAYOUTS.map(
          (l) => iconBtn({ action: "layout", id: String(l.n), label: l.label, icon: l.icon, pressed: layout === l.n, tooltip: l.label }),
        ).join("")}</div></div>`;

      /* ---------- the terminal ---------- */

      /** The grid of a tab at the frame it shows, with the control ring and the keyboard when a human holds it (live only). */
      const terminalView = (tab, { compact = false } = {}) => {
        const key = tabKey(tab);
        const frame = shownFrame(tab);
        const live = isLive(tab);
